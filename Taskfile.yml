version: '3'

tasks:
  check:
    desc: The complete offline gate.
    cmds:
      - task: validate
      - task: check:pool

  check:pool:
    desc: The gate without validate, for a build pool whose nodes have no claude executable; the same script the forge's Gate runs.
    cmds:
      - sh tools/gate.sh

  release:ready:
    desc: '`task release:ready -- <sha>` exits 0 only when Gate, Documentation validation and Documentation site ended success on that commit; run it before the release tag.'
    cmds:
      - sh tools/release-ready.sh {{.CLI_ARGS}}

  validate:
    desc: Validate the Claude Code plugin and marketplace manifests.
    cmds:
      - claude plugin validate --strict plugin
      - claude plugin validate --strict .

  check:plugin:
    desc: Check that manifests and marketplaces agree and every skill is complete.
    cmds:
      - sh tools/check-plugin.sh

  test:
    desc: Prove that the plugin, docs, workflow and release checks fail on broken trees and that the path list and the tag guard decide both ways.
    cmds:
      - timeout 60 sh tools/check-plugin.test.sh
      - timeout 60 sh tools/release.test.sh
      - timeout 60 sh tools/docs.test.sh
      - timeout 60 sh tools/gate.test.sh
      - timeout 60 sh tools/release-ready.test.sh
      - timeout 60 sh tools/check-themes.test.sh

  docs-generate:
    desc: Regenerate the derived documentation pages (website/docs/reference/skill.md, metrics.md, glossary.md, specification.md, website/docs/roadmap.md, status.md)
    cmds:
      - sh tools/docs.sh generate

  docs-check:
    desc: Fail when a derived documentation page is missing, stale or edited, or a page under website/docs breaks the page rules
    cmds:
      - sh tools/docs.sh check

  docs-site:
    desc: Build the Docusaurus site into website/build
    cmds:
      - npm --prefix website ci --allow-git=root
      - npm --prefix website run build

  test:own-gen:
    desc: Test the own generator (generators/own).
    cmds:
      - timeout 120 cargo test -p uxui-gen

  test:ux-static:
    desc: Test ux-static@1 (engine/static) on the studio and on planted broken copies.
    cmds:
      - timeout 120 cargo test -p ux-static

  test:ux-browser:
    desc: Test ux-browser@1 (engine/browser) without a browser, on WebSocket frames, scripted DevTools messages and recorded page geometry.
    cmds:
      - timeout 120 cargo test -p ux-browser

  ux:static:
    desc: Write the studio's ux-static@1 ratchet-evidence/1 document to target/studio-static.evidence.json.
    cmds:
      - cargo run -q -p ux-static -- --document ess/ui/studio.ui.yaml --journeys ess/ui/tests/studio.yaml --declarations ess/ui/studio.uxui.yaml --project uxui --assessment studio-static --out target/studio-static.evidence.json

  gen:climb:
    desc: Generate the live climb with the own generator into target/climb.
    cmds:
      - cargo run -q -p uxui-gen -- --path ess/ui/studio.ui.yaml --model ess --page campaigns.climb --out target/climb
