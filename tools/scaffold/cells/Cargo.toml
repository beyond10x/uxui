[package]
name = "uxui-cells"
version = "0.0.0"
edition = "2021"
publish = false
description = "Checks ess-ui/1 documents and draws them on the ESS terminal renderer in-process, printing where each node landed in cells."

[workspace]

[[bin]]
name = "uxui-cells"
path = "main.rs"

[dependencies]
ess-ui = { path = "../../../../ess/crates/ui/ess-ui" }
ess-ui-tui = { path = "../../../../ess/crates/ui/ess-ui-tui" }
ess-ui-check = { path = "../../../../ess/crates/ui/ess-ui-check" }
serde_json = "1"

[profile.release]
debug = false
