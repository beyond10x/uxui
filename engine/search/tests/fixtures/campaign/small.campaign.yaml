# A declaration the tests read: two axes, four variants, four environments. No page is behind it.
format: ux-search-campaign/1
page:
  path: /orders/list
  ready: 'main[data-ready]'
  ready_timeout_ms: 5000
  settle_ms: 100
  pointer: [380, 760]
environments:
  viewports: [1366x768, 390x844]
  modes:
    - {name: light, media: light}
    - {name: dark, media: dark, attribute: {name: data-theme, value: dark}, query: theme=dark, expect: {attribute: {name: data-theme, value: dark}, selector: 'body.dark'}}
axes:
  - name: spacing
    shipped: stock
    values:
      - id: tight
        rules:
          - {selector: ':root', set: {--space: 0.5rem, --gap: 0.25rem}}
      - id: stock
  - name: ink
    shipped: stock
    values:
      - id: stock
      - id: deep
        rules:
          - {selector: ':root', mode: light, set: {--ink: '#123456'}}
          - {selector: ':root[data-theme="dark"]', mode: dark, set: {--ink: '#abcdef'}}
          - {selector: .badge, set: {--badge-ink: 'var(--ink)'}}
primary: 'button.primary'
regions: 'header, main > section, footer'
always_visible:
  - {name: navigation, selector: nav}
  - {name: save, selector: 'button.primary'}
small_target_px: 24
hard: [primary_in_view, no_h_scroll, named]
terms: [always_visible_misses, low_contrast, text_under_14, overflow, primary_px, regions, small_targets]
