<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On the tokens</title>
<style>
:root { --color-bg: #ffffff; --color-fg: #1a1a1a; --color-accent: #0b5cad; --color-border: #d0d4da; --color-surface: #f4f6f8; --space: 4px; --only-light: #123456; }
@media (prefers-color-scheme: dark) {
  :root { --color-bg: #101418; --color-fg: #e8eaed; --color-accent: #8ab4f8; --color-border: #3c4043; --color-surface: #1b2127; --only-light: initial; }
}
html { background: var(--color-bg); color: var(--color-fg); font: 16px/1.5 sans-serif; }
body { margin: 0; padding: 16px; }
h1 { font-size: 25px; font-weight: 700; margin: 0 0 16px; }
h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
p { margin: 0 0 8px; }
.small { font-size: 12.8px; }
.card { display: flex; gap: 8px; margin: 0 0 16px; padding: 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; }
.card > div { padding: 4px 8px; border: 1px solid var(--color-border); border-radius: 4px; }
button { font: inherit; margin: 0; padding: 4px 16px; color: var(--color-bg); background: var(--color-accent); border: 0; border-radius: 999px; }
</style>
</head>
<body>
<h1>Tokens</h1>
<p>Every size, colour, gap and radius here is one the tokens declare.</p>
<div class="card"><div>Alpha</div><div>Beta</div><div>Gamma</div></div>
<h2>Actions</h2>
<p class="small">A note in the small size.</p>
<div><button type="button">Run</button></div>
</body>
</html>
