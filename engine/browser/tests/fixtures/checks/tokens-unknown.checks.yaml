format: ux-browser-checks/1
base_path: /
pages: {paths: [/on-scale/]}
viewports:
  - {name: 400x300, width: 400, height: 300}
modes: [light, dark]
settle_ms: 100
tokens:
  font_sizes: [12.8, 16, 20, 25]
  colours:
    properties: [--only-light]
    values: ['#ffffff', '#1a1a1a', '#0b5cad', '#d0d4da', 'rgb(244, 246, 248)']
