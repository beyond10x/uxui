<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An item under a dialog almost half-way</title>
<style>
html, body { margin: 0; padding: 0; font: 16px sans-serif; }
#item { position: absolute; left: 20px; top: 10px; box-sizing: border-box; width: 160px; height: 60px; border: 1px solid; }
dialog { position: absolute; left: 110px; top: 0; margin: 0; box-sizing: border-box; width: 200px; height: 120px; padding: 8px; border: 1px solid; }
</style>
</head>
<body>
<button type="button" id="item">Item</button>
<dialog open>A dialog</dialog>
</body>
</html>
