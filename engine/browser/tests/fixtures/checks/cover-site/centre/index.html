<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An item covered at its centre</title>
<style>
html, body { margin: 0; padding: 0; font: 16px sans-serif; }
#item { position: absolute; left: 20px; top: 10px; box-sizing: border-box; width: 160px; height: 60px; border: 1px solid; }
.badge { position: absolute; z-index: 1; left: 80px; top: 30px; width: 40px; height: 20px; background: #222; }
</style>
</head>
<body>
<button type="button" id="item">Item</button>
<div class="badge"></div>
</body>
</html>
