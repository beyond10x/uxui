<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An item under a sticky bar at one corner</title>
<style>
html, body { margin: 0; padding: 0; font: 16px sans-serif; }
.bar { position: sticky; top: 0; z-index: 1; height: 30px; margin-left: 170px; background: #222; color: #fff; }
#item { display: block; position: relative; box-sizing: border-box; margin: -20px 0 0 20px; width: 160px; height: 60px; border: 1px solid; }
</style>
</head>
<body>
<div class="bar">Bar</div>
<button type="button" id="item">Item</button>
</body>
</html>
