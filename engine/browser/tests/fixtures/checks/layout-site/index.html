<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout rules</title>
<style>
html, body { margin: 0; padding: 0; font: 16px sans-serif; }
.scroll { width: 401px; height: 10px; }
.box { width: 200px; }
.box canvas { display: block; }
.wide-demo { width: 100px; }
.wide-demo pre { width: 150px; margin: 0; }
.chips { width: 100px; }
.chip { display: inline-block; width: 130px; height: 10px; }
</style>
</head>
<body>
<div class="scroll"></div>
<div class="box"><canvas width="202" height="10"></canvas></div>
<div class="wide-demo"><pre>x</pre></div>
<div class="chips"><span class="chip"></span></div>
</body>
</html>
