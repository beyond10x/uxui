<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clock</title>
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; }
body { height: 320px; background: #ffffff; color: #111111; }
@media (prefers-color-scheme: dark) { body { background: #101418; color: #eeeeee; } }
.block { position: absolute; top: 20px; width: 80px; height: 40px; }
.clock, .time { position: absolute; left: 20px; top: 80px; display: inline-block; width: 200px; height: 20px; font: 14px/20px monospace; white-space: nowrap; overflow: hidden; }

</style>
</head>
<body>
<span class="clock"></span><script>document.querySelector("span").textContent = new Date().toISOString();</script>
</body>
</html>
