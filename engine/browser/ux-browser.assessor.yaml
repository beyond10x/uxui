format: ratchet-assessor/1
name: ux-browser
version: "1"
command: ux-browser checks
targets: [build, deployment]
inputs:
  config: {type: path, required: true}
  build: {type: path}
  url: {type: string}
  pages: {type: string}
  capture: {type: path, local: true}
  profile: {type: path, local: true}
  values: {type: path, local: true}
  jobs: {type: integer, local: true}
  chrome-arg: {type: string, list: true, local: true}
conditions: [viewports, modes, ready, settle_ms, reduced_motion, page_slack_px, overflow_tolerance_px, overflow_elements, overflow_exclude, clock]
coverage_unit: check
coverage: [executed, skipped, not_run, unsupported, passed, failed]
outputs:
  layout.page_scroll@1:
    {value_type: number, kind: exact, scopes: [page], unit: units}
  layout.overflow@1:
    {value_type: number, kind: exact, scopes: [page], unit: blocks}
  always_visible.misses@1:
    {value_type: number, kind: exact, scopes: [page], unit: items}
  keyboard.misses@1:
    {value_type: number, kind: exact, scopes: [page], unit: checks}
  layout_shift.after_ready@1:
    {value_type: number, kind: sampled, scopes: [page], unit: score}
  layout_shift.load@1:
    {value_type: number, kind: sampled, scopes: [page], unit: score}
  findings:
    value_type: identity_set
    kind: exact
    scopes: [page]
    identity_key: [rule, node_path]
    item_fields: [reason]
