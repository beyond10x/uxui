name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: A pull request of planning and prose files only ends here
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null && git diff --name-only 'HEAD^1' HEAD | sh tools/prose-only.sh; then
            echo "prose=true" >> "$GITHUB_OUTPUT"
          else
            echo "prose=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The toolchain of rust-toolchain.toml
        id: toolchain
        if: steps.scope.outputs.prose != 'true'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        if: steps.scope.outputs.prose != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.prose != 'true'
        with:
          workspaces: |
            . -> target
            engine/search -> engine/search/target
          shared-key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the checks that need no local login
        if: steps.scope.outputs.prose != 'true'
        run: sh tools/gate.sh
