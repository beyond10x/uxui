name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The toolchain of rust-toolchain.toml
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Run the checks that need no local login
        run: sh tools/gate.sh
      - name: The tag, the plugin, the crates and the changelog agree
        run: |
          set -euo pipefail
          sh tools/release-versions.sh "$GITHUB_REF_NAME"

  package:
    name: Package x86_64-unknown-linux-gnu
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The toolchain of rust-toolchain.toml
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Build, smoke-test and package the assessors and ux-search
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          export RUSTFLAGS="--remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          cargo build --locked --release --target "$target" -p ux-browser -p ux-static
          cargo build --manifest-path engine/search/Cargo.toml --locked --release --target "$target" --target-dir target
          sh tools/release-versions.sh "$GITHUB_REF_NAME" "target/$target/release"
          for bin in ux-browser ux-static ux-search; do
            if grep -a -q -E '/home/[A-Za-z0-9_.-]+/' "target/$target/release/$bin"; then
              echo "$bin names a home directory:" >&2
              grep -a -o -E '/home/[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]*' "target/$target/release/$bin" | sort -u | head -5 >&2 || true
              exit 1
            fi
          done
          for bin in ux-browser ux-static ux-search; do
            "target/$target/release/$bin" --help > /dev/null 2>&1 || test "$?" = 2
            package="$bin-$GITHUB_REF_NAME-$target"
            mkdir -p "dist/$package"
            cp "target/$target/release/$bin" LICENSE README.md "dist/$package/"
            assessor=$(ls engine/*/"$bin".assessor.yaml 2>/dev/null | head -1 || true)
            if [ -n "$assessor" ]; then cp "$assessor" "dist/$package/"; fi
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-x86_64-unknown-linux-gnu
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Bundle release assets
    needs: [gate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives, write checksums and notes
        run: |
          set -euo pipefail
          for bin in ux-browser ux-static ux-search; do
            test -f "dist/$bin-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" || { echo "::error::missing $bin archive" >&2; exit 1; }
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && sha256sum --check SHA256SUMS && cat SHA256SUMS)
          sh tools/release-notes.sh "$GITHUB_REF_NAME" > dist/notes.md
          test -s dist/notes.md || { echo "::error::CHANGELOG.md has no ${GITHUB_REF_NAME} notes" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uxui-${{ github.ref_name }}-release
          path: dist/*
          if-no-files-found: error
