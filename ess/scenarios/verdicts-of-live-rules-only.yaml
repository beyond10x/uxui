type: ess-scenario/7
covers:
  - uxsearch.journeys.EnumerateStateSpace/outcome/variant-pruned
  - uxsearch.rules.RecordRuleVerdict/outcome/rule-retired
  - uxsearch.rules.RecordRuleVerdict/outcome/rule-of-another-target
  - uxsearch.rules.RetireRule/outcome/retired
domain: uxsearch.rules
scenario: verdicts-of-live-rules-only
# Hardening target 5 (R6): a retired rule or another target's rule records no verdict; retiring
# a rule voids its verdicts, and a void hard violation no longer prunes the variant.
summary: Only an Active rule of the variant's target prunes it
arrange:
  - instance: variant
    entity: uxsearch.design.Variant
    setup:
      identity: "sha256:variant-a"
      fields:
        base_document_id: 00000000-0000-4000-8000-000000000010
        target_id: 00000000-0000-4000-8000-000000000001
        first_route: {design_space_id: 00000000-0000-4000-8000-000000000020, origin: search, choices: [], applications: []}
        routes: []
      state: Candidate
  - instance: rule-live
    entity: uxsearch.rules.DesignRule
    setup:
      identity: 00000000-0000-4000-8000-000000000080
      fields:
        target_id: 00000000-0000-4000-8000-000000000001
        name: required nodes visible
        strength: hard
        scope: journey
        check: required_visible
        node_paths: []
        metric_key: attention.visible_required
        requirement_id: attention.visible_required
      state: Active
  - instance: rule-retired
    entity: uxsearch.rules.DesignRule
    setup:
      identity: 00000000-0000-4000-8000-000000000081
      fields:
        target_id: 00000000-0000-4000-8000-000000000001
        name: old density limit
        strength: soft
        scope: page
        check: density
        node_paths: []
        metric_key: layout.density
      state: Retired
  - instance: rule-elsewhere
    entity: uxsearch.rules.DesignRule
    setup:
      identity: 00000000-0000-4000-8000-000000000082
      fields:
        target_id: 00000000-0000-4000-8000-000000000002
        name: another target's rule
        strength: hard
        scope: page
        check: required_visible
        node_paths: []
        metric_key: attention.visible_required
        requirement_id: other.visible_required
      state: Active
  - instance: violation
    entity: uxsearch.rules.RuleVerdict
    setup:
      identity: 00000000-0000-4000-8000-000000000090
      fields:
        rule_id: 00000000-0000-4000-8000-000000000080
        variant_digest: "sha256:variant-a"
        target_id: 00000000-0000-4000-8000-000000000001
        strength: hard
        requirement_id: attention.visible_required
        stage: full
        verdict: violated
        findings: []
      state: Recorded
  - instance: journey
    entity: uxsearch.journeys.Journey
    setup:
      identity: 00000000-0000-4000-8000-000000000030
      fields:
        target_id: 00000000-0000-4000-8000-000000000001
        name: change the email
        test_file: tests/settings.yaml
        test_name: change the email
        required_nodes: []
        required_selectors: []
        bounds: {max_states: 10, max_depth: 5, max_virtual_time_ms: 1000}
      state: Active
timeline:
  - at: 2026-01-05T09:00:00Z
    command: uxsearch.rules.RecordRuleVerdict
    actor: uxsearch.rules.RuleChecker
    input:
      rule_id: {$instance: rule-retired}
      variant_digest: {$instance: variant}
      stage: static
      verdict: violated
      findings: []
    outcome: rule-retired
  - at: 2026-01-05T09:00:01Z
    command: uxsearch.rules.RecordRuleVerdict
    actor: uxsearch.rules.RuleChecker
    input:
      rule_id: {$instance: rule-elsewhere}
      variant_digest: {$instance: variant}
      stage: static
      verdict: violated
      findings: []
    outcome: rule-of-another-target
  - at: 2026-01-05T09:00:02Z
    command: uxsearch.journeys.EnumerateStateSpace
    actor: uxsearch.journeys.Enumerator
    input:
      state_space_key: "sha256:space-before"
      journey_id: {$instance: journey}
      variant_digest: {$instance: variant}
      stage: full
    outcome: variant-pruned
  - at: 2026-01-05T09:00:03Z
    command: uxsearch.rules.RetireRule
    actor: uxsearch.rules.RuleAuthor
    input:
      rule_id: {$instance: rule-live}
    outcome: retired
  - at: 2026-01-05T09:00:04Z
    command: uxsearch.journeys.EnumerateStateSpace
    actor: uxsearch.journeys.Enumerator
    input:
      state_space_key: "sha256:space-after"
      journey_id: {$instance: journey}
      variant_digest: {$instance: variant}
      stage: full
    outcome: started
assert:
  - view: uxsearch.rules.RuleVerdicts
    contains: {rule_verdict_id: {$instance: violation}, state: Void}
  - view: uxsearch.rules.RuleVerdicts
    excludes: {rule_id: {$instance: rule-retired}}
