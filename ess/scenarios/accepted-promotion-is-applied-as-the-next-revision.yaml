type: ess-scenario/7
covers:
  - uxsearch.promotion.ApplyPromotion/outcome/wrong-state
  - uxsearch.promotion.ApplyPromotion/outcome/no-base-document
  - uxsearch.promotion.ApplyPromotion/outcome/not-a-successor
  - uxsearch.promotion.ApplyPromotion/outcome/applied
  - uxsearch.promotion.Promotion/transition/apply/by/uxsearch.promotion.ApplyPromotion/applied
  - uxsearch.promotion.Promotion/invariant/after/uxsearch.promotion.ApplyPromotion/applied
  - uxsearch.promotion.Promotion/state/Proposed/refuses/uxsearch.promotion.ApplyPromotion
  - uxsearch.promotion.Promotion/state/Accepted/refuses/uxsearch.promotion.AcceptPromotion
  - uxsearch.promotion.Promotion/state/Accepted/refuses/uxsearch.promotion.AcceptTradeOff
  - uxsearch.promotion.Promotion/state/Accepted/refuses/uxsearch.promotion.RecordGateDecision
  - uxsearch.promotion.Promotion/state/Accepted/refuses/uxsearch.promotion.RejectPromotion
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.AcceptPromotion
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.AcceptTradeOff
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.ApplyPromotion
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.RecordGateDecision
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.RejectPromotion
  - uxsearch.promotion.Promotion/state/Applied/refuses/uxsearch.promotion.SupersedePromotion
domain: uxsearch.promotion
scenario: accepted-promotion-is-applied-as-the-next-revision
# Story spec-round-2-scenarios; docs/concept.md § 6. Only an Accepted promotion is applied, and
# only as a base-document revision that supersedes another one. An Accepted promotion is not
# accepted, gated or rejected again; an Applied one is final: nothing accepts, gates, applies,
# rejects or supersedes it.
summary: An Accepted promotion is applied once, as a base-document revision that supersedes another
arrange:
  - instance: first
    entity: uxsearch.design.BaseDocument
    setup:
      identity: 00000000-0000-4000-8000-000000000010
      fields:
        path: ess/ui/app.ui.yaml
        app: settings
        document_digest: "sha256:doc-0"
        adapter: ess-ui
      state: Registered
  - instance: next
    entity: uxsearch.design.BaseDocument
    setup:
      identity: 00000000-0000-4000-8000-000000000011
      fields:
        path: ess/ui/app.ui.yaml
        app: settings
        document_digest: "sha256:doc-1"
        adapter: ess-ui
        supersedes: 00000000-0000-4000-8000-000000000010
      state: Registered
  - instance: accepted
    entity: uxsearch.promotion.Promotion
    setup:
      identity: 00000000-0000-4000-8000-000000000070
      fields:
        campaign_id: 00000000-0000-4000-8000-000000000050
        target_id: 00000000-0000-4000-8000-000000000001
        variant_digest: "sha256:variant-a"
        diff: {patches: []}
        propagates_to: []
        rationale: fewer actions
        gate: pass
        gate_trade_off_only: false
        gate_evidence_ids: []
        gate_requirement_verdicts: [{requirement_id: settings.actions, verdict: pass}]
        losses: []
        gains: [{requirement_id: settings.actions, reference: 8, candidate: 5}]
        accepted_by: owner-1
      state: Accepted
  - instance: proposed
    entity: uxsearch.promotion.Promotion
    setup:
      identity: 00000000-0000-4000-8000-000000000071
      fields:
        campaign_id: 00000000-0000-4000-8000-000000000050
        target_id: 00000000-0000-4000-8000-000000000001
        variant_digest: "sha256:variant-b"
        diff: {patches: []}
        propagates_to: []
        rationale: less scrolling
        gate: pass
        gate_trade_off_only: false
        gate_evidence_ids: []
        gate_requirement_verdicts: []
        losses: []
        gains: []
      state: Proposed
timeline:
  # Nobody accepted this one yet.
  - at: 2026-01-05T09:00:00Z
    command: uxsearch.promotion.ApplyPromotion
    actor: uxsearch.design.Engine
    input:
      promotion_id: {$instance: proposed}
      base_document_id: {$instance: next}
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionApplied]
  # Accepted: not accepted, gated or rejected again.
  - at: 2026-01-05T09:00:01Z
    command: uxsearch.promotion.AcceptPromotion
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-2}
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionAccepted]
  - at: 2026-01-05T09:00:02Z
    command: uxsearch.promotion.AcceptTradeOff
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-2}
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionAccepted]
  - at: 2026-01-05T09:00:03Z
    command: uxsearch.promotion.RecordGateDecision
    actor: uxsearch.ratchet.Ratchet
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
      verdict: fail
      policy_revision: policy-8
      evidence_ids: []
      requirement_verdicts: [{requirement_id: settings.actions, verdict: fail}]
      trade_off_only: false
      losses: []
      gains: []
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.GateDecided]
  - at: 2026-01-05T09:00:04Z
    command: uxsearch.promotion.RejectPromotion
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-1}
    input:
      promotion_id: {$instance: accepted}
      reason: changed my mind
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionRejected]
  - at: 2026-01-05T09:00:05Z
    command: uxsearch.promotion.ApplyPromotion
    actor: uxsearch.design.Engine
    input:
      promotion_id: {$instance: accepted}
      base_document_id: 00000000-0000-4000-8000-0000000000ff
    outcome: no-base-document
    error: {name: uxsearch.promotion.BaseDocumentNotFound, fields: {base_document_id: 00000000-0000-4000-8000-0000000000ff}}
    no_events: [uxsearch.promotion.PromotionApplied]
  # The revision named supersedes nothing: it is not the next revision of anything.
  - at: 2026-01-05T09:00:06Z
    command: uxsearch.promotion.ApplyPromotion
    actor: uxsearch.design.Engine
    input:
      promotion_id: {$instance: accepted}
      base_document_id: {$instance: first}
    outcome: not-a-successor
    error: {name: uxsearch.promotion.NotASuccessor, fields: {base_document_id: 00000000-0000-4000-8000-000000000010}}
    no_events: [uxsearch.promotion.PromotionApplied]
  - at: 2026-01-05T09:00:07Z
    command: uxsearch.promotion.ApplyPromotion
    actor: uxsearch.design.Engine
    input:
      promotion_id: {$instance: accepted}
      base_document_id: {$instance: next}
    outcome: applied
    events: [{event: uxsearch.promotion.PromotionApplied, payload: {promotion_id: 00000000-0000-4000-8000-000000000070, base_document_id: 00000000-0000-4000-8000-000000000011}}]
  # Applied is final.
  - at: 2026-01-05T09:00:08Z
    command: uxsearch.promotion.ApplyPromotion
    actor: uxsearch.design.Engine
    input:
      promotion_id: {$instance: accepted}
      base_document_id: {$instance: next}
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionApplied]
  - at: 2026-01-05T09:00:09Z
    command: uxsearch.promotion.AcceptPromotion
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-2}
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionAccepted]
  - at: 2026-01-05T09:00:10Z
    command: uxsearch.promotion.AcceptTradeOff
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-2}
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionAccepted]
  - at: 2026-01-05T09:00:11Z
    command: uxsearch.promotion.RecordGateDecision
    actor: uxsearch.ratchet.Ratchet
    input:
      promotion_id: {$instance: accepted}
      variant_digest: "sha256:variant-a"
      verdict: fail
      policy_revision: policy-8
      evidence_ids: []
      requirement_verdicts: [{requirement_id: settings.actions, verdict: fail}]
      trade_off_only: false
      losses: []
      gains: []
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.GateDecided]
  - at: 2026-01-05T09:00:12Z
    command: uxsearch.promotion.RejectPromotion
    actor: uxsearch.promotion.Owner
    caller: {principal: owner-1}
    input:
      promotion_id: {$instance: accepted}
      reason: changed my mind
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionRejected]
  - at: 2026-01-05T09:00:13Z
    command: uxsearch.promotion.SupersedePromotion
    actor: uxsearch.design.Designer
    input:
      promotion_id: {$instance: accepted}
      reason: a newer proposal
    outcome: wrong-state
    error: {name: uxsearch.promotion.PromotionStateConflict}
    no_events: [uxsearch.promotion.PromotionSuperseded]
assert:
  - view: uxsearch.promotion.PromotionById
    params: {promotion_id: {$instance: accepted}}
    contains: {gate: pass, gate_trade_off_only: false, accepted_by: owner-1, applied_as: {$instance: next}, superseded_reason: null, state: Applied}
  - view: uxsearch.promotion.PromotionById
    params: {promotion_id: {$instance: proposed}}
    contains: {accepted_by: null, applied_as: null, state: Proposed}
  - view: uxsearch.promotion.Promotions
    satisfies: {any: [gate_trade_off_only == false, gate == fail]}
