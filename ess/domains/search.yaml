      - name: target_id
        type: uxsearch.design.TargetId
      - name: strategy
        type: uxsearch.search.Strategy

  - name: uxsearch.search.PolicyPinned
    fields:
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: policy_digest
        type: uxsearch.search.PolicyDigest

  - name: uxsearch.search.CampaignStopped
    fields:
      - name: campaign_id
        type: uxsearch.search.CampaignId

  - name: uxsearch.search.CampaignEnded
    fields:
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: reason
        type: uxsearch.search.EndReason

  # The progress event: the climb a person watches live.
  - name: uxsearch.search.CampaignProgressed
    fields:
      - name: climb_point_id
        type: uxsearch.search.ClimbPointId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: seq
        type: Integer
      - name: evaluated
        type: Integer
      - name: pruned
        type: Integer
      - name: frontier_size
        type: Integer

  - name: uxsearch.search.ClimbReadingRecorded
    fields:
      - name: climb_reading_id
        type: uxsearch.search.ClimbReadingId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: seq
        type: Integer
      - name: kpi_id
        type: uxsearch.metrics.KpiId
      - name: best
        type: Decimal

  - name: uxsearch.search.FrontierChanged
    fields:
      - name: frontier_entry_id
        type: uxsearch.search.FrontierEntryId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: admitted
        type: Boolean

views:
  - name: uxsearch.search.Campaigns
    source: uxsearch.search.Campaign
    consistency: read_your_writes
    fields:
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: target_id
        type: uxsearch.design.TargetId
      - name: design_space_id
        type: uxsearch.design.DesignSpaceId
      - name: strategy
        type: uxsearch.search.Strategy
      - name: seed
        type: Integer
      - name: budget
        type: uxsearch.search.Budget
      - name: ended_because
        type: Optional<uxsearch.search.EndReason>
      - name: state
        type: uxsearch.search.Campaign.State
    naming:
      wire: campaigns
      display: Campaigns

  - name: uxsearch.search.CampaignById
    source: uxsearch.search.Campaign
    consistency: read_your_writes
    params:
      - name: campaign_id
        type: uxsearch.search.CampaignId
    filter: campaign_id == param.campaign_id
    fields:
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: target_id
        type: uxsearch.design.TargetId
      - name: design_space_id
        type: uxsearch.design.DesignSpaceId
      - name: journeys
        type: List<uxsearch.journeys.JourneyId>
      - name: environments
        type: List<uxsearch.evaluation.EnvironmentId>
      - name: kpis
        type: List<uxsearch.metrics.KpiId>
      - name: strategy
        type: uxsearch.search.Strategy
      - name: budget
        type: uxsearch.search.Budget
      - name: policy_digest
        type: Optional<uxsearch.search.PolicyDigest>
      - name: layout_model_version
        type: Optional<uxsearch.evaluation.LayoutModelVersion>
      - name: catalogue_digest
        type: Optional<uxsearch.evaluation.CatalogueDigest>
      - name: ended_because
        type: Optional<uxsearch.search.EndReason>
      - name: state
        type: uxsearch.search.Campaign.State
    naming:
      wire: campaign
      display: Campaign

  - name: uxsearch.search.ClimbPoints
    source: uxsearch.search.ClimbPoint
    consistency: read_your_writes
    fields:
      - name: climb_point_id
        type: uxsearch.search.ClimbPointId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: seq
        type: Integer
      - name: evaluated
        type: Integer
      - name: pruned
        type: Integer
      - name: insufficient
        type: Integer
      - name: frontier_size
        type: Integer
      - name: state
        type: uxsearch.search.ClimbPoint.State
    naming:
      wire: climb-points
      display: Climb points

  - name: uxsearch.search.Climb
    source: uxsearch.search.ClimbPoint
    consistency: read_your_writes
    params:
      - name: campaign_id
        type: uxsearch.search.CampaignId
    filter: campaign_id == param.campaign_id
    fields:
      - name: climb_point_id
        type: uxsearch.search.ClimbPointId
      - name: seq
        type: Integer
      - name: evaluated
        type: Integer
      - name: pruned
        type: Integer
      - name: insufficient
        type: Integer
      - name: frontier_size
        type: Integer
      - name: at
        type: Timestamp
    naming:
      wire: climb
      display: Climb

  # One row per (climb point, KPI): the best value of one KPI over the steps of a campaign.
  - name: uxsearch.search.ClimbOfKpi
    source: uxsearch.search.ClimbReading
    consistency: read_your_writes
    params:
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: kpi_id
        type: uxsearch.metrics.KpiId
    filter:
      all:
        - campaign_id == param.campaign_id
        - kpi_id == param.kpi_id
    fields:
      - name: climb_reading_id
        type: uxsearch.search.ClimbReadingId
      - name: seq
        type: Integer
      - name: best
        type: Decimal
    naming:
      wire: climb-of-kpi
      display: Climb of a KPI

  - name: uxsearch.search.FrontierEntries
    source: uxsearch.search.FrontierEntry
    consistency: read_your_writes
    fields:
      - name: frontier_entry_id
        type: uxsearch.search.FrontierEntryId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: dominated_by
        type: Optional<uxsearch.design.VariantDigest>
      - name: withdraw_reason
        type: Optional<String>
      - name: state
        type: uxsearch.search.FrontierEntry.State
    naming:
      wire: frontier-entries
      display: Frontier entries

  - name: uxsearch.search.Frontier
    source: uxsearch.search.FrontierEntry
    consistency: read_your_writes
    params:
      - name: campaign_id
        type: uxsearch.search.CampaignId
    filter:
      all:
        - campaign_id == param.campaign_id
        - state == OnFrontier
    fields:
      - name: frontier_entry_id
        type: uxsearch.search.FrontierEntryId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: kpi_values
        type: List<uxsearch.search.KpiReading>
      - name: evaluation_keys
        type: List<uxsearch.evaluation.EvaluationKey>
    naming:
      wire: frontier
      display: Frontier
