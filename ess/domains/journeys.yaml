domain: uxsearch.journeys

summary: >-
  Journeys a target is evaluated on, taken from ess-ui-test/1 tests or, on a browser target, from
  scripted steps, and the state space each journey reaches on one variant within declared bounds:
  every UI state the engine enumerates from fixtures, scripted live events and a virtual clock, or
  the pages the scripted steps reach.

naming:
  wire: journeys
  display: Journeys

types:
  - name: uxsearch.journeys.JourneyId
    kind: newtype
    of: Uuid

  # The digest of (journey digest, variant digest, fixture digest, bounds, stage): a state space
  # is a pure function of these, so the key names it and a second enumeration of the same key is
  # a cache hit.
  - name: uxsearch.journeys.StateSpaceKey
    kind: newtype
    of: String
    prefix: "sha256:"

  - name: uxsearch.journeys.UiStateId
    kind: newtype
    of: Uuid

  # The digest of one UI state: page, open overlay, selection, focus, fixture data and virtual
  # time, in canonical form.
  - name: uxsearch.journeys.UiStateDigest
    kind: newtype
    of: String
    prefix: "sha256:"

  # The bounds of a state space. Enumeration stops at the first bound it reaches, and the state
  # space is then Truncated: every evaluation over it is insufficient evidence.
  - name: uxsearch.journeys.StateSpaceBounds
    kind: struct
    fields:
      - name: max_states
        type: Integer
      - name: max_depth
        type: Integer
      # The latest virtual time a state may carry, in milliseconds since the journey opened.
      - name: max_virtual_time_ms
        type: Integer
    invariants:
      - max_states > 0
      - max_depth > 0
      - max_virtual_time_ms >= 0

  - name: uxsearch.journeys.BoundKind
    kind: enum
    variants: [max_states, max_depth, max_virtual_time]

  # What one scripted step of a `browser` journey does (docs/targets.md:17: "scripted steps (URLs,
  # clicks) for a site"): open a URL, click the element a CSS selector finds, press one key, scroll
  # the page to its top or bottom, or wait. `press`, `scroll` and `wait` are the steps the browser
  # adapter `ux-browser@1` takes in the shared page checks (docs/browser-adapter.md): the keyboard
  # walk presses Tab and Enter, the always-visible check scrolls to the bottom and waits before it
  # looks again.
  # UNMAPPED: typing text and an assertion step ("find the install command", docs/targets.md:65)
  # are not stated. Open question for the owner.
  - name: uxsearch.journeys.ScriptedAction
    kind: enum
    variants: [visit, click, press, scroll, wait]

  - name: uxsearch.journeys.ScriptedStep
    kind: struct
    fields:
      - name: action
        type: uxsearch.journeys.ScriptedAction
      # The URL or URL path for `visit`, the CSS selector for `click`, the key for `press` (`Tab`,
      # `Enter`), `top` or `bottom` for `scroll`, the milliseconds for `wait`.
      - name: target
        type: String

  # The steps of a scripted journey, in order. Each step's page is one UI state of the journey.
  - name: uxsearch.journeys.JourneyScript
    kind: struct
    fields:
      - name: steps
        type: List<uxsearch.journeys.ScriptedStep>

entities:
  # A journey has either a model or a script (docs/targets.md:82). On an `ess-ui` target it is a
  # named test of an ess-ui-test/1 file over the target's document, and its states are enumerated
  # from the model. On a `browser` target it is a script of steps, and its states are the pages
  # the steps reach. Its steps must stay inside the target: a component journey drives only nodes
  # under the component's path (a table's sort, filter and page states), rendered in the target's
  # harness. It is the one home of the journey's required nodes and completion signal, which the
  # task-completion metrics read.
  # The model fields and the script are Optional so that one record holds either; DeclareJourney
  # refuses a journey with both, with neither, or of the other adapter than its target's.
  # A model journey names its required nodes and completion signal by ess-ui/1 node path; a
  # scripted journey names them by CSS selector, as the browser adapter names every node it reads
  # (the render record's `nodes[].selector`, the page checks' `css`; docs/browser-adapter.md). A
  # lifted component maps one to the other through its binding table. DeclareJourney refuses the
  # other adapter's naming.
  - name: uxsearch.journeys.Journey
    naming:
      summary: A task through the UI, from one ess-ui-test/1 test or one script of steps, bound to one target.
    identity:
      name: journey_id
      type: uxsearch.journeys.JourneyId
    fields:
      - name: target_id
        type: uxsearch.design.TargetId
      - name: name
        type: String
      # The ess-ui-test/1 file and the test in it (`tests[].name`); present for a model journey.
      - name: test_file
        type: Optional<String>
      - name: test_name
        type: Optional<String>
      # The scripted steps; present for a scripted journey.
      - name: script
        type: Optional<uxsearch.journeys.JourneyScript>
      # The nodes a variant must keep for the journey to stay completable.
      - name: required_nodes
        type: List<uxsearch.design.NodePath>
      # The node whose appearance says the journey completed.
      - name: completion_signal
        type: Optional<uxsearch.design.NodePath>
      # A scripted journey's required nodes and completion signal, by CSS selector; empty and
      # absent for a model journey.
      - name: required_selectors
        type: List<uxsearch.design.CssSelector>
      - name: completion_selector
        type: Optional<uxsearch.design.CssSelector>
      # The bounds every state space of this journey is enumerated within.
      - name: bounds
        type: uxsearch.journeys.StateSpaceBounds
    relations:
      - name: target
        kind: references
        target: uxsearch.design.Target
        cardinality: one
        via: target_id
    lifecycle:
      initial: Active
      states: [Active, Retired]
      terminal: [Retired]
      transitions:
        - name: retire
          from: [Active]
          to: Retired

  - name: uxsearch.journeys.StateSpace
    naming:
      summary: Every UI state one journey reaches on one variant within its bounds.
    identity:
      name: state_space_key
      type: uxsearch.journeys.StateSpaceKey
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      # `journey_paths` enumerates the states on the journey's own paths (the merge gate's
      # evidence); `full` every state within the bounds (the promote gate's evidence). A `static`
      # evaluation has no state space.
      - name: stage
        type: uxsearch.evaluation.Stage
      # Copied from the journey when the enumeration starts; the caller does not choose them.
      - name: bounds
        type: uxsearch.journeys.StateSpaceBounds
      - name: states_count
        type: Integer
      - name: bound_hit
        type: Optional<uxsearch.journeys.BoundKind>
      - name: abandon_reason
        type: Optional<String>
    invariants:
      - states_count >= 0
      - stage != static
    relations:
      - name: journey
        kind: references
        target: uxsearch.journeys.Journey
        cardinality: one
        via: journey_id
      - name: variant
        kind: references
        target: uxsearch.design.Variant
        cardinality: one
        via: variant_digest
      - name: states
        kind: owns
        target: uxsearch.journeys.UiState
        cardinality: many
        via: state_space_key
    lifecycle:
      initial: Enumerating
      states:
        - Enumerating
        - {name: Complete, summary: Every reachable state within the bounds was enumerated and is evaluable.}
        - {name: Incomplete, summary: "Every reachable state was enumerated, but at least one is not evaluable; evaluations over it are insufficient evidence."}
        - {name: Truncated, summary: "A bound was hit; states beyond it are unknown."}
        - {name: Abandoned, summary: "The enumeration stopped without an end (a crash, a cancel); evaluations over it are insufficient evidence."}
      terminal: [Complete, Incomplete, Truncated, Abandoned]
      transitions:
        - name: complete
          from: [Enumerating]
          to: Complete
        - name: complete_incomplete
          from: [Enumerating]
          to: Incomplete
        - name: truncate
          from: [Enumerating]
          to: Truncated
        - name: abandon
          from: [Enumerating]
          to: Abandoned

  - name: uxsearch.journeys.UiState
    naming:
      summary: One reachable configuration of a page in a state space.
    identity:
      name: ui_state_id
      type: uxsearch.journeys.UiStateId
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      # The order the enumerator reached the state in, from 0. The states of one state space have
      # distinct `seq` and distinct `state_digest`, and a closed state space counts more states
      # than its highest `seq`.
      - name: seq
        type: Integer
      - name: state_digest
        type: uxsearch.journeys.UiStateDigest
      # The page node path; for a scripted journey's state, the URL path its step reached.
      # UNMAPPED: docs/targets.md does not say how a browser state names its page; taken here: the
      # URL path, held in the node path's place. Open question for the owner.
      - name: page
        type: uxsearch.design.NodePath
      - name: overlay
        type: Optional<uxsearch.design.NodePath>
      - name: focus
        type: Optional<uxsearch.design.NodePath>
      # Row keys of the selection, by section path, in canonical form.
      - name: selection
        type: List<String>
      - name: virtual_time_ms
        type: Integer
      - name: depth
        type: Integer
      # False when the engine cannot evaluate the state (the layout model refuses it, a fixture is
      # missing); a state space holding such a state ends Incomplete.
      - name: evaluable
        type: Boolean
      - name: unevaluable_reason
        type: Optional<String>
    invariants:
      - seq >= 0
      - virtual_time_ms >= 0
      - depth >= 0
    lifecycle:
      initial: Reached
      states: [Reached]
      terminal: [Reached]

actors:
  - name: uxsearch.journeys.JourneyAuthor
    naming:
      display: Journey author
      summary: A person who binds ess-ui-test/1 journeys to a target.
    may:
      - uxsearch.journeys.DeclareJourney
      - uxsearch.journeys.RetireJourney

  # A caller of the engine's own process, not `system: true`: the engine awaits the commands it
  # sends (uxsearch.design.Engine says why).
  - name: uxsearch.journeys.Enumerator
    naming:
      display: Enumerator
      summary: The engine's state-space enumerator.
    may:
      - uxsearch.journeys.EnumerateStateSpace
      - uxsearch.journeys.ReuseStateSpace
      - uxsearch.journeys.RecordUiState
      - uxsearch.journeys.CompleteStateSpace
      - uxsearch.journeys.TruncateStateSpace
      - uxsearch.journeys.AbandonStateSpace

errors:
  - name: uxsearch.journeys.TestRefused
    summary: The file is not an ess-ui-test/1 file of the target's document, or it has no test of that name.
    fields:
      - name: test_file
        type: Optional<String>

  - name: uxsearch.journeys.JourneySourceInvalid
    summary: A journey has either a test file and a test name, or a script, and not both; nothing was declared.
    fields:
      - name: name
        type: String

  - name: uxsearch.journeys.AdapterMismatch
    summary: A model journey needs an ess-ui target and a scripted journey a browser target; nothing was declared.
    fields:
      - name: adapter
        type: uxsearch.design.AdapterKind

  - name: uxsearch.journeys.OutsideTarget
    summary: A step of the test drives a node outside the target's path, so the journey is not bound.
    fields:
      - name: node_path
        type: uxsearch.design.NodePath

  - name: uxsearch.journeys.TargetNotFound
    summary: No target has this id, so nothing was declared.
    fields:
      - name: target_id
        type: uxsearch.design.TargetId

  - name: uxsearch.journeys.JourneyStateConflict
    summary: The journey is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: uxsearch.journeys.Journey.State

  - name: uxsearch.journeys.JourneyRetired
    summary: The journey is retired, so no state space is enumerated for it.
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId

  - name: uxsearch.journeys.JourneyNotFound
    summary: No journey has this id, so nothing was enumerated.
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId

  - name: uxsearch.journeys.VariantNotFound
    summary: No variant has this digest, so nothing was enumerated.
    fields:
      - name: variant_digest
        type: uxsearch.design.VariantDigest

  - name: uxsearch.journeys.VariantPruned
    summary: The variant is pruned by a hard rule, so it is not enumerated.
    fields:
      - name: variant_digest
        type: uxsearch.design.VariantDigest

  - name: uxsearch.journeys.StateSpaceExists
    summary: A state space of this key was enumerated before; ReuseStateSpace answers from it.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.KeyCollision
    summary: A state space of this key was enumerated for another journey, variant or stage, so the cache does not answer.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.StateSpaceNotFound
    summary: No state space has this key, so nothing was recorded.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.StateSpaceStateConflict
    summary: The state space is no longer being enumerated, so nothing changed.
    fields:
      - name: state
        type: uxsearch.journeys.StateSpace.State

  - name: uxsearch.journeys.BeyondBounds
    summary: The state or the count lies beyond the state space's bounds, so nothing was recorded.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.DuplicateState
    summary: The state space already holds a state with this digest or this sequence number, so nothing was recorded.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.CountMismatch
    summary: The count is not above the highest recorded sequence number, so the state space did not close.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

commands:
  - name: uxsearch.journeys.DeclareJourney
    naming:
      wire: declare-journey
      display: Declare a journey
    input:
      - name: target_id
        type: uxsearch.design.TargetId
      - name: name
        type: String
      - name: test_file
        type: Optional<String>
      - name: test_name
        type: Optional<String>
      - name: script
        type: Optional<uxsearch.journeys.JourneyScript>
      - name: required_nodes
        type: List<uxsearch.design.NodePath>
      - name: completion_signal
        type: Optional<uxsearch.design.NodePath>
      - name: required_selectors
        type: List<uxsearch.design.CssSelector>
      - name: completion_selector
        type: Optional<uxsearch.design.CssSelector>
      - name: bounds
        type: uxsearch.journeys.StateSpaceBounds
    outcomes:
      # Either a test file with a test name, or a script: not both, not neither, not half a test.
      - name: source-invalid
        when:
          any:
            - all: [{not: defined(test_file)}, {not: defined(script)}]
            - all: [defined(test_file), defined(script)]
            - all: [defined(test_file), {not: defined(test_name)}]
            - all: [defined(test_name), {not: defined(test_file)}]
        error: uxsearch.journeys.JourneySourceInvalid
        payload:
          uxsearch.journeys.JourneySourceInvalid:
            name: input.name
        summary: Nothing was declared.

      - name: no-target
        when_related:
          via: input.target_id
          exists: false
        error: uxsearch.journeys.TargetNotFound
        payload:
          uxsearch.journeys.TargetNotFound:
            target_id: input.target_id
        summary: Nothing was declared.

      # A browser target has no model to enumerate states from.
      - name: model-on-browser
        when: defined(test_file)
        when_related:
          via: input.target_id
          predicate: adapter == browser
        error: uxsearch.journeys.AdapterMismatch
        payload:
          uxsearch.journeys.AdapterMismatch:
            adapter: browser
        summary: Nothing was declared.

      # An ess-ui target's states are enumerated from its model, not walked by a script.
      - name: script-on-ess-ui
        when: defined(script)
        when_related:
          via: input.target_id
          predicate: {adapter: [ess-ui]}
        error: uxsearch.journeys.AdapterMismatch
        payload:
          uxsearch.journeys.AdapterMismatch:
            adapter: ess-ui
        summary: Nothing was declared.

      # A browser page has no ess-ui/1 node paths: a scripted journey names its nodes by selector.
      - name: node-paths-on-browser
        when:
          any:
            - required_nodes.count > 0
            - defined(completion_signal)
        when_related:
          via: input.target_id
          predicate: adapter == browser
        error: uxsearch.journeys.AdapterMismatch
        payload:
          uxsearch.journeys.AdapterMismatch:
            adapter: browser
        summary: Nothing was declared.

      # An ess-ui target's nodes are node paths of its document, not CSS selectors.
      - name: selectors-on-ess-ui
        when:
          any:
            - required_selectors.count > 0
            - defined(completion_selector)
        when_related:
          via: input.target_id
          predicate: {adapter: [ess-ui]}
        error: uxsearch.journeys.AdapterMismatch
        payload:
          uxsearch.journeys.AdapterMismatch:
            adapter: ess-ui
        summary: Nothing was declared.

      - name: test-refused
        external: the file is not an ess-ui-test/1 file naming the target's document, or holds no such test
        error: uxsearch.journeys.TestRefused
        payload:
          uxsearch.journeys.TestRefused:
            test_file: input.test_file
        summary: Nothing was declared.

      - name: outside-target
        external: a step of the test, a required node or the completion signal names a node path outside the target's node path or members; a scripted step leaves the target's base URL
        error: uxsearch.journeys.OutsideTarget
        summary: Nothing was declared.

      - name: declared
        creates: uxsearch.journeys.Journey
        instance: journey_id
        sets:
          target_id: input.target_id
          name: input.name
          test_file: input.test_file
          test_name: input.test_name
          script: input.script
          required_nodes: input.required_nodes
          completion_signal: input.completion_signal
          required_selectors: input.required_selectors
          completion_selector: input.completion_selector
          bounds: input.bounds
        emits:
          - uxsearch.journeys.JourneyDeclared
        payload:
          uxsearch.journeys.JourneyDeclared:
            journey_id: {generated: true}
            target_id: input.target_id
        summary: The journey is Active and can be named by a campaign.

  - name: uxsearch.journeys.RetireJourney
    naming:
      wire: retire-journey
      display: Retire a journey
    input:
      - name: journey_id
        type: uxsearch.journeys.JourneyId
    outcomes:
      - name: retired
        moves: uxsearch.journeys.Journey.retire
        instance: journey_id
        emits:
          - uxsearch.journeys.JourneyRetiredEvent
        payload:
          uxsearch.journeys.JourneyRetiredEvent:
            journey_id: input.journey_id
        summary: No new campaign names the journey; past evaluations keep it.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.journeys.JourneyStateConflict
        summary: The journey was already retired.

  # The state space is a pure function of its key: an unknown key starts enumeration, a known
  # one is answered from what was enumerated before, provided it was enumerated from the same
  # journey, variant and stage. The bounds are the journey's.
  - name: uxsearch.journeys.EnumerateStateSpace
    naming:
      wire: enumerate-state-space
      display: Enumerate a state space
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: stage
        type: uxsearch.evaluation.Stage
    outcomes:
      # A stored key is never enumerated again: ReuseStateSpace answers from it or refuses a
      # collision.
      - name: already-enumerated
        existing_instance: true
        error: uxsearch.journeys.StateSpaceExists
        payload:
          uxsearch.journeys.StateSpaceExists:
            state_space_key: input.state_space_key
        summary: Nothing was enumerated; ReuseStateSpace answers for this key.

      - name: no-journey
        when_related:
          via: input.journey_id
          exists: false
        error: uxsearch.journeys.JourneyNotFound
        payload:
          uxsearch.journeys.JourneyNotFound:
            journey_id: input.journey_id
        summary: Nothing was enumerated.

      - name: no-variant
        when_related:
          via: input.variant_digest
          exists: false
        error: uxsearch.journeys.VariantNotFound
        payload:
          uxsearch.journeys.VariantNotFound:
            variant_digest: input.variant_digest
        summary: Nothing was enumerated.

      - name: journey-retired
        when_related:
          via: input.journey_id
          predicate: state == Retired
        error: uxsearch.journeys.JourneyRetired
        payload:
          uxsearch.journeys.JourneyRetired:
            journey_id: input.journey_id
        summary: Nothing was enumerated.

      # A variant with a Recorded hard Violated verdict is never evaluated further.
      - name: variant-pruned
        when_related:
          entity: uxsearch.rules.RuleVerdict
          where:
            all:
              - variant_digest == input.variant_digest
              - strength == hard
              - verdict == violated
              - state == Recorded
          exists: true
        error: uxsearch.journeys.VariantPruned
        payload:
          uxsearch.journeys.VariantPruned:
            variant_digest: input.variant_digest
        summary: Nothing was enumerated.

      - name: started
        creates: uxsearch.journeys.StateSpace
        instance: state_space_key
        sets:
          journey_id: input.journey_id
          variant_digest: input.variant_digest
          stage: input.stage
          bounds: {related: {via: input.journey_id, field: bounds}}
          states_count: 0
        emits:
          - uxsearch.journeys.StateSpaceStarted
        payload:
          uxsearch.journeys.StateSpaceStarted:
            state_space_key: input.state_space_key
        summary: Enumeration of a new state space started within the journey's bounds.

  # The cache lookup, split from EnumerateStateSpace so that the collision check reads the stored
  # row alone (`when_subject`). As a row-set guard on the creating command it multiplied synthesis
  # time (GAPS.md G14). The enumerator asks here first and enumerates on `no-state-space`.
  - name: uxsearch.journeys.ReuseStateSpace
    naming:
      wire: reuse-state-space
      display: Reuse a state space
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: stage
        type: uxsearch.evaluation.Stage
    outcomes:
      - name: no-state-space
        unknown_instance: true
        error: uxsearch.journeys.StateSpaceNotFound
        payload:
          uxsearch.journeys.StateSpaceNotFound:
            state_space_key: input.state_space_key
        summary: Nothing is cached under this key; the enumerator enumerates it.

      - name: key-collision
        when_subject:
          predicate:
            any:
              - journey_id != input.journey_id
              - variant_digest != input.variant_digest
              - stage != input.stage
        error: uxsearch.journeys.KeyCollision
        payload:
          uxsearch.journeys.KeyCollision:
            state_space_key: input.state_space_key
        summary: Nothing was answered.

      - name: cached
        preserves: uxsearch.journeys.StateSpace
        instance: state_space_key
        summary: The state space was enumerated before, or is being enumerated; nothing is enumerated again.


  - name: uxsearch.journeys.RecordUiState
    naming:
      wire: record-ui-state
      display: Record a UI state
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: seq
        type: Integer
      - name: state_digest
        type: uxsearch.journeys.UiStateDigest
      - name: page
        type: uxsearch.design.NodePath
      - name: overlay
        type: Optional<uxsearch.design.NodePath>
      - name: focus
        type: Optional<uxsearch.design.NodePath>
      - name: selection
        type: List<String>
      - name: virtual_time_ms
        type: Integer
      - name: depth
        type: Integer
      - name: evaluable
        type: Boolean
      - name: unevaluable_reason
        type: Optional<String>
    outcomes:
      - name: no-state-space
        when_related:
          via: input.state_space_key
          exists: false
        error: uxsearch.journeys.StateSpaceNotFound
        payload:
          uxsearch.journeys.StateSpaceNotFound:
            state_space_key: input.state_space_key
        summary: Nothing was recorded.

      - name: not-enumerating
        when_related:
          via: input.state_space_key
          predicate: state != Enumerating
        error: uxsearch.journeys.StateSpaceStateConflict
        payload:
          uxsearch.journeys.StateSpaceStateConflict:
            state: {related: {via: input.state_space_key, field: state}}
        summary: The state space is closed; nothing was recorded.

      # A state past a bound is not part of the state space: the enumerator truncates instead.
      - name: beyond-bounds
        when_related:
          via: input.state_space_key
          predicate:
            any:
              - bounds.max_states <= input.seq
              - bounds.max_depth < input.depth
              - bounds.max_virtual_time_ms < input.virtual_time_ms
        error: uxsearch.journeys.BeyondBounds
        payload:
          uxsearch.journeys.BeyondBounds:
            state_space_key: input.state_space_key
        summary: Nothing was recorded.

      - name: duplicate-state
        when_related:
          entity: uxsearch.journeys.UiState
          where:
            all:
              - state_space_key == input.state_space_key
              - any:
                  - state_digest == input.state_digest
                  - seq == input.seq
          exists: true
        error: uxsearch.journeys.DuplicateState
        payload:
          uxsearch.journeys.DuplicateState:
            state_space_key: input.state_space_key
        summary: Nothing was recorded.

      - name: recorded
        creates: uxsearch.journeys.UiState
        instance: ui_state_id
        sets:
          state_space_key: input.state_space_key
          seq: input.seq
          state_digest: input.state_digest
          page: input.page
          overlay: input.overlay
          focus: input.focus
          selection: input.selection
          virtual_time_ms: input.virtual_time_ms
          depth: input.depth
          evaluable: input.evaluable
          unevaluable_reason: input.unevaluable_reason
        emits:
          - uxsearch.journeys.UiStateReached
        payload:
          uxsearch.journeys.UiStateReached:
            ui_state_id: {generated: true}
            state_space_key: input.state_space_key
            evaluable: input.evaluable
        summary: The state is part of the state space.

  # Closing a state space checks the count against the bounds and the recorded states. A state
  # space holding a state that is not evaluable ends Incomplete, never Complete.
  - name: uxsearch.journeys.CompleteStateSpace
    naming:
      wire: complete-state-space
      display: Complete a state space
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: states_count
        type: Integer
    outcomes:
      - name: no-state-space
        when_related:
          via: input.state_space_key
          exists: false
        error: uxsearch.journeys.StateSpaceNotFound
        payload:
          uxsearch.journeys.StateSpaceNotFound:
            state_space_key: input.state_space_key
        summary: Nothing was closed.

      - name: over-bound
        when_related:
          via: input.state_space_key
          predicate: bounds.max_states < input.states_count
        error: uxsearch.journeys.BeyondBounds
        payload:
          uxsearch.journeys.BeyondBounds:
            state_space_key: input.state_space_key
        summary: A count over the bound is a truncation, not a completion; nothing was closed.

      - name: count-below-recorded
        when_related:
          entity: uxsearch.journeys.UiState
          where:
            all:
              - state_space_key == input.state_space_key
              - seq >= input.states_count
          exists: true
        error: uxsearch.journeys.CountMismatch
        payload:
          uxsearch.journeys.CountMismatch:
            state_space_key: input.state_space_key
        summary: Nothing was closed.

      - name: unevaluable
        when_related:
          entity: uxsearch.journeys.UiState
          where:
            all:
              - state_space_key == input.state_space_key
              - evaluable == false
          exists: true
        moves: uxsearch.journeys.StateSpace.complete_incomplete
        instance: state_space_key
        sets:
          states_count: input.states_count
        emits:
          - uxsearch.journeys.StateSpaceClosed
        payload:
          uxsearch.journeys.StateSpaceClosed:
            state_space_key: input.state_space_key
            states_count: input.states_count
            truncated: false
        summary: Every reachable state is recorded, and at least one is not evaluable.

      - name: completed
        moves: uxsearch.journeys.StateSpace.complete
        instance: state_space_key
        sets:
          states_count: input.states_count
        emits:
          - uxsearch.journeys.StateSpaceClosed
        payload:
          uxsearch.journeys.StateSpaceClosed:
            state_space_key: input.state_space_key
            states_count: input.states_count
            truncated: false
        summary: Every reachable state within the bounds is recorded and evaluable.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.journeys.StateSpaceStateConflict
        summary: The state space was already closed.

  - name: uxsearch.journeys.TruncateStateSpace
    naming:
      wire: truncate-state-space
      display: Truncate a state space
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: states_count
        type: Integer
      - name: bound_hit
        type: uxsearch.journeys.BoundKind
    outcomes:
      - name: no-state-space
        when_related:
          via: input.state_space_key
          exists: false
        error: uxsearch.journeys.StateSpaceNotFound
        payload:
          uxsearch.journeys.StateSpaceNotFound:
            state_space_key: input.state_space_key
        summary: Nothing was closed.

      - name: over-bound
        when_related:
          via: input.state_space_key
          predicate: bounds.max_states < input.states_count
        error: uxsearch.journeys.BeyondBounds
        payload:
          uxsearch.journeys.BeyondBounds:
            state_space_key: input.state_space_key
        summary: Nothing was closed.

      - name: count-below-recorded
        when_related:
          entity: uxsearch.journeys.UiState
          where:
            all:
              - state_space_key == input.state_space_key
              - seq >= input.states_count
          exists: true
        error: uxsearch.journeys.CountMismatch
        payload:
          uxsearch.journeys.CountMismatch:
            state_space_key: input.state_space_key
        summary: Nothing was closed.

      - name: truncated
        moves: uxsearch.journeys.StateSpace.truncate
        instance: state_space_key
        sets:
          states_count: input.states_count
          bound_hit: input.bound_hit
        emits:
          - uxsearch.journeys.StateSpaceClosed
        payload:
          uxsearch.journeys.StateSpaceClosed:
            state_space_key: input.state_space_key
            states_count: input.states_count
            truncated: true
        summary: A bound was hit; evaluations over this state space are insufficient evidence.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.journeys.StateSpaceStateConflict
        summary: The state space was already closed.

  - name: uxsearch.journeys.AbandonStateSpace
    naming:
      wire: abandon-state-space
      display: Abandon a state space
    input:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: reason
        type: String
    outcomes:
      - name: abandoned
        moves: uxsearch.journeys.StateSpace.abandon
        instance: state_space_key
        sets:
          abandon_reason: input.reason
        emits:
          - uxsearch.journeys.StateSpaceAbandoned
        payload:
          uxsearch.journeys.StateSpaceAbandoned:
            state_space_key: input.state_space_key
            reason: input.reason
        summary: The enumeration ended without a result; evaluations over it are insufficient evidence.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.journeys.StateSpaceStateConflict
        summary: The state space was already closed.

events:
  - name: uxsearch.journeys.JourneyDeclared
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: target_id
        type: uxsearch.design.TargetId

  - name: uxsearch.journeys.JourneyRetiredEvent
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId

  - name: uxsearch.journeys.StateSpaceStarted
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.journeys.UiStateReached
    fields:
      - name: ui_state_id
        type: uxsearch.journeys.UiStateId
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: evaluable
        type: Boolean

  - name: uxsearch.journeys.StateSpaceClosed
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: states_count
        type: Integer
      - name: truncated
        type: Boolean

  - name: uxsearch.journeys.StateSpaceAbandoned
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: reason
        type: String

views:
  - name: uxsearch.journeys.Journeys
    source: uxsearch.journeys.Journey
    consistency: read_your_writes
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: target_id
        type: uxsearch.design.TargetId
      - name: name
        type: String
      - name: test_file
        type: Optional<String>
      - name: test_name
        type: Optional<String>
      - name: script
        type: Optional<uxsearch.journeys.JourneyScript>
      - name: required_nodes
        type: List<uxsearch.design.NodePath>
      - name: completion_signal
        type: Optional<uxsearch.design.NodePath>
      - name: required_selectors
        type: List<uxsearch.design.CssSelector>
      - name: completion_selector
        type: Optional<uxsearch.design.CssSelector>
      - name: state
        type: uxsearch.journeys.Journey.State
    naming:
      wire: journeys
      display: Journeys

  # The Active journeys of one target: the choices a campaign of that target may name.
  - name: uxsearch.journeys.JourneysOfTarget
    source: uxsearch.journeys.Journey
    consistency: read_your_writes
    params:
      - name: target_id
        type: uxsearch.design.TargetId
    filter:
      all:
        - target_id == param.target_id
        - state == Active
    fields:
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: name
        type: String
    naming:
      wire: journeys-of-target
      display: Journeys of a target

  - name: uxsearch.journeys.StateSpaces
    source: uxsearch.journeys.StateSpace
    consistency: read_your_writes
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: stage
        type: uxsearch.evaluation.Stage
      - name: bounds
        type: uxsearch.journeys.StateSpaceBounds
      - name: states_count
        type: Integer
      - name: bound_hit
        type: Optional<uxsearch.journeys.BoundKind>
      - name: abandon_reason
        type: Optional<String>
      - name: state
        type: uxsearch.journeys.StateSpace.State
    naming:
      wire: state-spaces
      display: State spaces

  - name: uxsearch.journeys.UiStates
    source: uxsearch.journeys.UiState
    consistency: read_your_writes
    fields:
      - name: ui_state_id
        type: uxsearch.journeys.UiStateId
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: seq
        type: Integer
      - name: state_digest
        type: uxsearch.journeys.UiStateDigest
      - name: page
        type: uxsearch.design.NodePath
      - name: overlay
        type: Optional<uxsearch.design.NodePath>
      - name: virtual_time_ms
        type: Integer
      - name: depth
        type: Integer
      - name: evaluable
        type: Boolean
      - name: unevaluable_reason
        type: Optional<String>
      - name: state
        type: uxsearch.journeys.UiState.State
    naming:
      wire: ui-states
      display: UI states
