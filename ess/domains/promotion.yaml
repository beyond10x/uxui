views:
  # The change of one promotion, per source file: what the pull request carries.
  - name: uxsearch.promotion.SourceDiffsOfPromotion
    source: uxsearch.promotion.SourceDiff
    consistency: read_your_writes
    params:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
    filter: promotion_id == param.promotion_id
    fields:
      - name: source_diff_id
        type: uxsearch.promotion.SourceDiffId
      - name: path
        type: String
      - name: unified_diff
        type: String
      - name: state
        type: uxsearch.promotion.SourceDiff.State
    naming:
      wire: source-diffs-of-promotion
      display: Source diffs of a promotion

  - name: uxsearch.promotion.Promotions
    source: uxsearch.promotion.Promotion
    consistency: read_your_writes
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: rationale
        type: String
      - name: gate
        type: uxsearch.promotion.GateStatus
      - name: gate_trade_off_only
        type: Boolean
      - name: accepted_by
        type: Optional<String>
      - name: rejection_reason
        type: Optional<String>
      - name: state
        type: uxsearch.promotion.Promotion.State
    naming:
      wire: promotions
      display: Promotions

  - name: uxsearch.promotion.PromotionById
    source: uxsearch.promotion.Promotion
    consistency: read_your_writes
    params:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
    filter: promotion_id == param.promotion_id
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
      - name: campaign_id
        type: uxsearch.search.CampaignId
      - name: target_id
        type: uxsearch.design.TargetId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: diff
        type: uxsearch.promotion.DocumentDiff
      - name: propagates_to
        type: List<uxsearch.design.NodePath>
      - name: rationale
        type: String
      - name: gate
        type: uxsearch.promotion.GateStatus
      - name: gate_trade_off_only
        type: Boolean
      - name: gate_policy_revision
        type: Optional<String>
      - name: gate_requirement_verdicts
        type: List<uxsearch.ratchet.RequirementVerdict>
      - name: gate_evidence_ids
        type: List<uxsearch.ratchet.EvidenceId>
      - name: losses
        type: List<uxsearch.promotion.RequirementChange>
      - name: gains
        type: List<uxsearch.promotion.RequirementChange>
      - name: accepted_by
        type: Optional<String>
      - name: applied_as
        type: Optional<uxsearch.design.BaseDocumentId>
      - name: superseded_reason
        type: Optional<String>
      - name: state
        type: uxsearch.promotion.Promotion.State
    naming:
      wire: promotion
      display: Promotion

  - name: uxsearch.promotion.Judgements
    source: uxsearch.promotion.JudgementRecord
    consistency: read_your_writes
    fields:
      - name: judgement_id
        type: uxsearch.promotion.JudgementId
      - name: kind
        type: uxsearch.promotion.JudgementKind
      - name: author_kind
        type: uxsearch.promotion.AuthorKind
      - name: author
        type: String
      - name: left_variant
        type: uxsearch.design.VariantDigest
      - name: right_variant
        type: Optional<uxsearch.design.VariantDigest>
      - name: preferred
        type: Optional<uxsearch.design.VariantDigest>
      - name: note
        type: String
      - name: disposition
        type: Optional<uxsearch.promotion.Disposition>
      - name: state
        type: uxsearch.promotion.JudgementRecord.State
    naming:
      wire: judgements
      display: Judgements
