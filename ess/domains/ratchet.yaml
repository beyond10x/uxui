domain: uxsearch.ratchet

summary: >-
  How the engine's records map to ratchet's terms. The engine keeps no baseline of its own:
  metrics are ratchet measurements, hard rules and gates are ratchet requirements, the engine is
  an assessor that returns evidence records carrying the resolved target, ratchet decides every
  gate, and a promoted variant's values reach ratchet only as a proposed reference change.

naming:
  wire: ratchet
  display: Ratchet

types:
  # Ratchet's own identifiers, held as text: the engine names them and never owns them.
  - name: uxsearch.ratchet.RequirementId
    kind: newtype
    of: String

  - name: uxsearch.ratchet.EvidenceId
    kind: newtype
    of: Uuid

  - name: uxsearch.ratchet.ReferenceProposalId
    kind: newtype
    of: Uuid

  # What the assessor returns. `insufficient_evidence` is never read as a pass; whether an
  # observation passes is ratchet's decision against its requirement, never the engine's.
  - name: uxsearch.ratchet.EvidenceStatus
    kind: enum
    variants: [observed, insufficient_evidence]

  - name: uxsearch.ratchet.GateVerdict
    kind: enum
    variants: [pass, fail, insufficient_evidence]

  # A finding's stable identity: rule check, node path, environment.
  - name: uxsearch.ratchet.FindingIdentity
    kind: struct
    fields:
      - name: check
        type: uxsearch.rules.RuleCheck
      - name: node_path
        type: uxsearch.design.NodePath
      - name: environment_digest
        type: Optional<uxsearch.evaluation.EnvironmentDigest>

  - name: uxsearch.ratchet.RequirementVerdict
    kind: struct
    fields:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
      - name: verdict
        type: uxsearch.ratchet.GateVerdict

entities:
  # The engine's side of a ratchet requirement: which metric of which target it measures. The
  # comparison (absolute limit, regression, no new findings), thresholds, tolerances, gate policy
  # and protected references are ratchet's and are not restated here. A hard rule names its
  # requirement (uxsearch.rules.DesignRule.requirement_id), so pruning and the gate read one limit.
  - name: uxsearch.ratchet.RequirementBinding
    naming:
      summary: Which metric of which target a ratchet requirement measures.
    identity:
      name: requirement_id
      type: uxsearch.ratchet.RequirementId
    fields:
      - name: target_id
        type: uxsearch.design.TargetId
      - name: metric_key
        type: uxsearch.metrics.MetricKey
    relations:
      - {name: target, kind: references, target: uxsearch.design.Target, cardinality: one, via: target_id}
      - {name: metric, kind: references, target: uxsearch.metrics.MetricDefinition, cardinality: one, via: metric_key}
    lifecycle:
      initial: Bound
      states: [Bound, Unbound]
      terminal: [Unbound]
      transitions:
        - name: unbind
          from: [Bound]
          to: Unbound

  # One observation the engine returns to ratchet as an assessor. Every field but the status,
  # the observed value and the findings is copied from the evaluation or rule verdict and the
  # metric it names, never taken from the input, so ratchet can refuse incomparable evidence.
  # The fixture digest is part of the state space key and the font table of the layout model
  # version. Rule evidence has no evaluation, so its evaluation fields stay absent.
  - name: uxsearch.ratchet.EvidenceRecord
    naming:
      summary: One observation the engine returns to ratchet as an assessor, with its resolved target.
    identity:
      name: evidence_id
      type: uxsearch.ratchet.EvidenceId
    fields:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
      - name: metric_key
        type: uxsearch.metrics.MetricKey
      - name: metric_version
        type: Integer
      - name: unit
        type: uxsearch.metrics.MetricUnit
      - name: scope
        type: uxsearch.metrics.MetricScope
      - name: kind
        type: uxsearch.metrics.MetricKind
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: stage
        type: uxsearch.evaluation.Stage
      - name: environment_id
        type: Optional<uxsearch.evaluation.EnvironmentId>
      - name: layout_model_version
        type: Optional<uxsearch.evaluation.LayoutModelVersion>
      - name: evaluation_key
        type: Optional<uxsearch.evaluation.EvaluationKey>
      - name: states_count
        type: Optional<Integer>
      - name: bound_hit
        type: Optional<uxsearch.journeys.BoundKind>
      - name: catalogue_digest
        type: Optional<uxsearch.evaluation.CatalogueDigest>
      - name: declarations_digest
        type: Optional<uxsearch.design.DocumentDigest>
      # The base document's revision, the ESS release and the assessor with its version
      # (`ux-eval@1` for evaluations, `ux-static@1` for the document alone; docs/ratchet.md § 1).
      - name: base_revision
        type: String
      - name: ess_version
        type: String
      - name: assessor
        type: String
      - name: status
        type: uxsearch.ratchet.EvidenceStatus
      - name: observed
        type: Optional<Decimal>
      - name: findings
        type: List<uxsearch.ratchet.FindingIdentity>
    relations:
      - {name: requirement, kind: references, target: uxsearch.ratchet.RequirementBinding, cardinality: one, via: requirement_id}
      - {name: metric, kind: references, target: uxsearch.metrics.MetricDefinition, cardinality: one, via: metric_key}
      - {name: evaluation, kind: references, target: uxsearch.evaluation.Evaluation, cardinality: one, via: evaluation_key}
      - {name: variant, kind: references, target: uxsearch.design.Variant, cardinality: one, via: variant_digest}
      - {name: environment, kind: references, target: uxsearch.evaluation.Environment, cardinality: one, via: environment_id}
      - {name: layout_model, kind: references, target: uxsearch.evaluation.LayoutModel, cardinality: one, via: layout_model_version}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # The reference change an accepted promotion offers ratchet (`ratchet reference propose`): one
  # per promotion, naming its losses and gains as ratchet reported them, its evidence and who
  # authorized it. Ratchet checks the trade-off and adopts or declines it under its ratchet policy.
  - name: uxsearch.ratchet.ReferenceProposal
    naming:
      summary: The reference change an accepted promotion offers ratchet.
    identity:
      name: reference_proposal_id
      type: uxsearch.ratchet.ReferenceProposalId
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: trade_off
        type: Boolean
      - name: losses
        type: List<uxsearch.promotion.RequirementChange>
      - name: gains
        type: List<uxsearch.promotion.RequirementChange>
      - name: evidence_ids
        type: List<uxsearch.ratchet.EvidenceId>
      # The principal who accepted the promotion.
      - name: authorized_by
        type: Optional<String>
      # Ratchet's record of who or what decided the proposal.
      - name: decided_by
        type: Optional<String>
    relations:
      - {name: variant, kind: references, target: uxsearch.design.Variant, cardinality: one, via: variant_digest}
      - {name: promotion, kind: references, target: uxsearch.promotion.Promotion, cardinality: one, via: promotion_id}
      - {name: evidence, kind: references, target: uxsearch.ratchet.EvidenceRecord, cardinality: many, via: evidence_ids}
    lifecycle:
      initial: Proposed
      states: [Proposed, Adopted, Declined]
      terminal: [Adopted, Declined]
      transitions:
        - name: adopt
          from: [Proposed]
          to: Adopted
        - name: decline
          from: [Proposed]
          to: Declined

actors:
  - name: uxsearch.ratchet.QualityOwner
    naming:
      display: Quality owner
      summary: Binds ratchet requirements to a target's metrics.
    may:
      - uxsearch.ratchet.BindRequirement
      - uxsearch.ratchet.UnbindRequirement

  # A caller of the engine's own process, not `system: true` (uxsearch.design.Engine says why).
  - name: uxsearch.ratchet.Assessor
    naming:
      display: Assessor
      summary: The engine acting as a ratchet assessor; it records evidence and proposes reference changes.
    may:
      - uxsearch.ratchet.RecordMetricEvidence
      - uxsearch.ratchet.RecordRuleEvidence
      - uxsearch.ratchet.ProposeReference

  # Ratchet is an external system; this actor is its import client. Its gate and reference
  # decisions are recorded as ratchet made them (reviews/2026-11-24-uxsearch-hardening.md, R4).
  - name: uxsearch.ratchet.Ratchet
    naming:
      display: Ratchet
      summary: Ratchet itself; its gate decisions and reference decisions are imported.
    may:
      - uxsearch.promotion.RecordGateDecision
      - uxsearch.ratchet.RecordReferenceDecision

errors:
  - name: uxsearch.ratchet.TargetNotFound
    summary: No target has this id.
    fields:
      - name: target_id
        type: uxsearch.design.TargetId

  - name: uxsearch.ratchet.MetricNotFound
    summary: No metric of the catalogue has this key.
    fields:
      - name: metric_key
        type: uxsearch.metrics.MetricKey

  - name: uxsearch.ratchet.RequirementBoundElsewhere
    summary: The requirement id is already bound to another target or metric; nothing changed.
    fields:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId

  - name: uxsearch.ratchet.RequirementStateConflict
    summary: The binding is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: uxsearch.ratchet.RequirementBinding.State

  - name: uxsearch.ratchet.RequirementNotBound
    summary: No bound requirement has this id, so no evidence was recorded.
    fields:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId

  - name: uxsearch.ratchet.RequirementMismatch
    summary: The requirement measures another metric, or the verdict is of another requirement; no evidence was recorded.
    fields:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId

  - name: uxsearch.ratchet.EvaluationNotFound
    summary: No evaluation has this key, so no evidence was recorded.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

  - name: uxsearch.ratchet.ValueMismatch
    summary: The evaluation holds no value of this metric equal to the observation, so no evidence was recorded.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

  - name: uxsearch.ratchet.RuleVerdictNotFound
    summary: No rule verdict has this id, so no evidence was recorded.
    fields:
      - name: rule_verdict_id
        type: uxsearch.rules.RuleVerdictId

  - name: uxsearch.ratchet.PromotionNotFound
    summary: No promotion has this id.
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId

  - name: uxsearch.ratchet.PromotionNotAccepted
    summary: A reference change is proposed only from an accepted promotion.
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId

  - name: uxsearch.ratchet.ReferenceAlreadyProposed
    summary: The promotion's reference change was already proposed.
    fields:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId

  - name: uxsearch.ratchet.ReferenceProposalStateConflict
    summary: The proposal was already decided, so nothing moved.
    fields:
      - name: state
        type: uxsearch.ratchet.ReferenceProposal.State

commands:
  - name: uxsearch.ratchet.BindRequirement
    naming:
      wire: bind-requirement
      display: Bind a ratchet requirement
    input:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
      - name: target_id
        type: uxsearch.design.TargetId
      - name: metric_key
        type: uxsearch.metrics.MetricKey
    outcomes:
      - name: no-target
        when_related:
          via: input.target_id
          exists: false
        error: uxsearch.ratchet.TargetNotFound
        payload:
          uxsearch.ratchet.TargetNotFound:
            target_id: input.target_id
        summary: Nothing was bound.

      - name: no-metric
        when_related:
          via: input.metric_key
          exists: false
        error: uxsearch.ratchet.MetricNotFound
        payload:
          uxsearch.ratchet.MetricNotFound:
            metric_key: input.metric_key
        summary: Nothing was bound.

      - name: bound
        unknown_instance: true
        creates: uxsearch.ratchet.RequirementBinding
        instance: requirement_id
        sets:
          target_id: input.target_id
          metric_key: input.metric_key
        emits:
          - uxsearch.ratchet.RequirementBound
        payload:
          uxsearch.ratchet.RequirementBound:
            requirement_id: input.requirement_id
            target_id: input.target_id
        summary: The engine records evidence for the requirement from now on.

      - name: bound-elsewhere
        when_related:
          entity: uxsearch.ratchet.RequirementBinding
          where:
            all:
              - requirement_id == input.requirement_id
              - any:
                  - target_id != input.target_id
                  - metric_key != input.metric_key
          exists: true
        error: uxsearch.ratchet.RequirementBoundElsewhere
        payload:
          uxsearch.ratchet.RequirementBoundElsewhere:
            requirement_id: input.requirement_id
        summary: Nothing changed.

      - name: same
        preserves: uxsearch.ratchet.RequirementBinding
        instance: requirement_id
        summary: The same binding exists; nothing changed.

  - name: uxsearch.ratchet.UnbindRequirement
    naming:
      wire: unbind-requirement
      display: Unbind a ratchet requirement
    input:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
    outcomes:
      - name: unbound
        moves: uxsearch.ratchet.RequirementBinding.unbind
        instance: requirement_id
        emits:
          - uxsearch.ratchet.RequirementUnbound
        payload:
          uxsearch.ratchet.RequirementUnbound:
            requirement_id: input.requirement_id
        summary: No more evidence is recorded for it; ratchet still holds the requirement.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.ratchet.RequirementStateConflict
        summary: The binding was already removed.

  # Evidence from an evaluation, for a bound requirement of the same metric. An evaluation that
  # is not Computed (a bound hit, a state not evaluable, an abandoned enumeration, not yet
  # computed) yields insufficient evidence with no observed value: never an observation ratchet
  # could pass. An observed value is one the evaluation holds for the metric.
  - name: uxsearch.ratchet.RecordMetricEvidence
    naming:
      wire: record-metric-evidence
      display: Record metric evidence
    input:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey
      - name: metric_key
        type: uxsearch.metrics.MetricKey
      - name: value
        type: Decimal
      - name: base_revision
        type: String
      - name: ess_version
        type: String
      - name: assessor
        type: String
    outcomes:
      - name: no-evaluation
        when_related:
          via: input.evaluation_key
          exists: false
        error: uxsearch.ratchet.EvaluationNotFound
        payload:
          uxsearch.ratchet.EvaluationNotFound:
            evaluation_key: input.evaluation_key
        summary: Nothing was recorded.

      - name: no-requirement
        when_related:
          via: input.requirement_id
          exists: false
        error: uxsearch.ratchet.RequirementNotBound
        payload:
          uxsearch.ratchet.RequirementNotBound:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: no-metric
        when_related:
          via: input.metric_key
          exists: false
        error: uxsearch.ratchet.MetricNotFound
        payload:
          uxsearch.ratchet.MetricNotFound:
            metric_key: input.metric_key
        summary: Nothing was recorded.

      - name: requirement-unbound
        when_related:
          via: input.requirement_id
          predicate: state != Bound
        error: uxsearch.ratchet.RequirementNotBound
        payload:
          uxsearch.ratchet.RequirementNotBound:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: requirement-mismatch
        when_related:
          via: input.requirement_id
          predicate: metric_key != input.metric_key
        error: uxsearch.ratchet.RequirementMismatch
        payload:
          uxsearch.ratchet.RequirementMismatch:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: value-mismatch
        when_related:
          via: input.evaluation_key
          predicate:
            all:
              - state == Computed
              - not:
                  exists:
                    in: values
                    as: v
                    that:
                      all:
                        - v.metric_key == input.metric_key
                        - v.value == input.value
        error: uxsearch.ratchet.ValueMismatch
        payload:
          uxsearch.ratchet.ValueMismatch:
            evaluation_key: input.evaluation_key
        summary: Nothing was recorded.

      - name: insufficient
        when_related:
          via: input.evaluation_key
          predicate: state != Computed
        creates: uxsearch.ratchet.EvidenceRecord
        instance: evidence_id
        sets:
          requirement_id: input.requirement_id
          metric_key: input.metric_key
          metric_version: {related: {via: input.metric_key, field: version}}
          unit: {related: {via: input.metric_key, field: unit}}
          scope: {related: {via: input.metric_key, field: scope}}
          kind: {related: {via: input.metric_key, field: kind}}
          variant_digest: {related: {via: input.evaluation_key, field: variant_digest}}
          stage: {related: {via: input.evaluation_key, field: stage}}
          environment_id: {related: {via: input.evaluation_key, field: environment_id}}
          layout_model_version: {related: {via: input.evaluation_key, field: layout_model_version}}
          evaluation_key: input.evaluation_key
          states_count: {related: {via: input.evaluation_key, field: states_count}}
          bound_hit: {related: {via: input.evaluation_key, field: bound_hit}}
          catalogue_digest: {related: {via: input.evaluation_key, field: catalogue_digest}}
          declarations_digest: {related: {via: input.evaluation_key, field: declarations_digest}}
          base_revision: input.base_revision
          ess_version: input.ess_version
          assessor: input.assessor
          status: insufficient_evidence
          findings: []
        emits:
          - uxsearch.ratchet.EvidenceRecorded
        payload:
          uxsearch.ratchet.EvidenceRecorded:
            evidence_id: {generated: true}
            requirement_id: input.requirement_id
            status: insufficient_evidence
        summary: The evaluation is not Computed; ratchet reads insufficient evidence, never a pass.

      - name: observed
        creates: uxsearch.ratchet.EvidenceRecord
        instance: evidence_id
        sets:
          requirement_id: input.requirement_id
          metric_key: input.metric_key
          metric_version: {related: {via: input.metric_key, field: version}}
          unit: {related: {via: input.metric_key, field: unit}}
          scope: {related: {via: input.metric_key, field: scope}}
          kind: {related: {via: input.metric_key, field: kind}}
          variant_digest: {related: {via: input.evaluation_key, field: variant_digest}}
          stage: {related: {via: input.evaluation_key, field: stage}}
          environment_id: {related: {via: input.evaluation_key, field: environment_id}}
          layout_model_version: {related: {via: input.evaluation_key, field: layout_model_version}}
          evaluation_key: input.evaluation_key
          states_count: {related: {via: input.evaluation_key, field: states_count}}
          bound_hit: {related: {via: input.evaluation_key, field: bound_hit}}
          catalogue_digest: {related: {via: input.evaluation_key, field: catalogue_digest}}
          declarations_digest: {related: {via: input.evaluation_key, field: declarations_digest}}
          base_revision: input.base_revision
          ess_version: input.ess_version
          assessor: input.assessor
          status: observed
          observed: input.value
          findings: []
        emits:
          - uxsearch.ratchet.EvidenceRecorded
        payload:
          uxsearch.ratchet.EvidenceRecorded:
            evidence_id: {generated: true}
            requirement_id: input.requirement_id
            status: observed
        summary: The observed value goes to ratchet, which compares it with its requirement.
      # UNMAPPED: the requirement's target should be the evaluated variant's target; the
      # evaluation holds the variant, not the target, and a guard over the variant's target is a
      # second hop (GAPS.md G8). The engine binds requirements per target, so it is not checked.

  - name: uxsearch.ratchet.RecordRuleEvidence
    naming:
      wire: record-rule-evidence
      display: Record rule evidence
    input:
      - name: requirement_id
        type: uxsearch.ratchet.RequirementId
      - name: rule_verdict_id
        type: uxsearch.rules.RuleVerdictId
      - name: metric_key
        type: uxsearch.metrics.MetricKey
      - name: findings
        type: List<uxsearch.ratchet.FindingIdentity>
      - name: base_revision
        type: String
      - name: ess_version
        type: String
      - name: assessor
        type: String
    outcomes:
      - name: no-verdict
        when_related:
          via: input.rule_verdict_id
          exists: false
        error: uxsearch.ratchet.RuleVerdictNotFound
        payload:
          uxsearch.ratchet.RuleVerdictNotFound:
            rule_verdict_id: input.rule_verdict_id
        summary: Nothing was recorded.

      - name: no-requirement
        when_related:
          via: input.requirement_id
          exists: false
        error: uxsearch.ratchet.RequirementNotBound
        payload:
          uxsearch.ratchet.RequirementNotBound:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: no-metric
        when_related:
          via: input.metric_key
          exists: false
        error: uxsearch.ratchet.MetricNotFound
        payload:
          uxsearch.ratchet.MetricNotFound:
            metric_key: input.metric_key
        summary: Nothing was recorded.

      - name: requirement-unbound
        when_related:
          via: input.requirement_id
          predicate: state != Bound
        error: uxsearch.ratchet.RequirementNotBound
        payload:
          uxsearch.ratchet.RequirementNotBound:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: requirement-mismatch
        when_related:
          via: input.requirement_id
          predicate: metric_key != input.metric_key
        error: uxsearch.ratchet.RequirementMismatch
        payload:
          uxsearch.ratchet.RequirementMismatch:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: verdict-of-another-requirement
        when_related:
          via: input.rule_verdict_id
          predicate:
            any:
              - {not: defined(requirement_id)}
              - requirement_id != input.requirement_id
        error: uxsearch.ratchet.RequirementMismatch
        payload:
          uxsearch.ratchet.RequirementMismatch:
            requirement_id: input.requirement_id
        summary: Nothing was recorded.

      - name: insufficient
        when_related:
          via: input.rule_verdict_id
          predicate: verdict == insufficient_evidence
        creates: uxsearch.ratchet.EvidenceRecord
        instance: evidence_id
        sets:
          requirement_id: input.requirement_id
          metric_key: input.metric_key
          metric_version: {related: {via: input.metric_key, field: version}}
          unit: {related: {via: input.metric_key, field: unit}}
          scope: {related: {via: input.metric_key, field: scope}}
          kind: {related: {via: input.metric_key, field: kind}}
          variant_digest: {related: {via: input.rule_verdict_id, field: variant_digest}}
          stage: {related: {via: input.rule_verdict_id, field: stage}}
          environment_id: {related: {via: input.rule_verdict_id, field: environment_id}}
          layout_model_version: {related: {via: input.rule_verdict_id, field: layout_model_version}}
          base_revision: input.base_revision
          ess_version: input.ess_version
          assessor: input.assessor
          status: insufficient_evidence
          findings: []
        emits:
          - uxsearch.ratchet.EvidenceRecorded
        payload:
          uxsearch.ratchet.EvidenceRecorded:
            evidence_id: {generated: true}
            requirement_id: input.requirement_id
            status: insufficient_evidence
        summary: The rule could not be decided; ratchet reads insufficient evidence, never a pass.

      - name: observed
        creates: uxsearch.ratchet.EvidenceRecord
        instance: evidence_id
        sets:
          requirement_id: input.requirement_id
          metric_key: input.metric_key
          metric_version: {related: {via: input.metric_key, field: version}}
          unit: {related: {via: input.metric_key, field: unit}}
          scope: {related: {via: input.metric_key, field: scope}}
          kind: {related: {via: input.metric_key, field: kind}}
          variant_digest: {related: {via: input.rule_verdict_id, field: variant_digest}}
          stage: {related: {via: input.rule_verdict_id, field: stage}}
          environment_id: {related: {via: input.rule_verdict_id, field: environment_id}}
          layout_model_version: {related: {via: input.rule_verdict_id, field: layout_model_version}}
          base_revision: input.base_revision
          ess_version: input.ess_version
          assessor: input.assessor
          status: observed
          findings: input.findings
        emits:
          - uxsearch.ratchet.EvidenceRecorded
        payload:
          uxsearch.ratchet.EvidenceRecorded:
            evidence_id: {generated: true}
            requirement_id: input.requirement_id
            status: observed
        summary: The findings go to ratchet, which compares them by identity.

  # One reference change per accepted promotion: its losses and gains as ratchet reported them in
  # the gate decision, its evidence, and the principal who accepted it.
  - name: uxsearch.ratchet.ProposeReference
    naming:
      wire: propose-reference
      display: Propose a reference change
    input:
      - name: promotion_id
        type: uxsearch.promotion.PromotionId
    outcomes:
      - name: no-promotion
        when_related:
          via: input.promotion_id
          exists: false
        error: uxsearch.ratchet.PromotionNotFound
        payload:
          uxsearch.ratchet.PromotionNotFound:
            promotion_id: input.promotion_id
        summary: Nothing was proposed.

      - name: not-accepted
        when_related:
          via: input.promotion_id
          predicate:
            all:
              - state != Accepted
              - state != Applied
        error: uxsearch.ratchet.PromotionNotAccepted
        payload:
          uxsearch.ratchet.PromotionNotAccepted:
            promotion_id: input.promotion_id
        summary: Nothing was proposed.

      - name: already-proposed
        when_related:
          entity: uxsearch.ratchet.ReferenceProposal
          where: promotion_id == input.promotion_id
          exists: true
        error: uxsearch.ratchet.ReferenceAlreadyProposed
        payload:
          uxsearch.ratchet.ReferenceAlreadyProposed:
            promotion_id: input.promotion_id
        summary: Nothing changed.

      - name: proposed
        creates: uxsearch.ratchet.ReferenceProposal
        instance: reference_proposal_id
        sets:
          promotion_id: input.promotion_id
          variant_digest: {related: {via: input.promotion_id, field: variant_digest}}
          trade_off: {related: {via: input.promotion_id, field: gate_trade_off_only}}
          losses: {related: {via: input.promotion_id, field: losses}}
          gains: {related: {via: input.promotion_id, field: gains}}
          evidence_ids: {related: {via: input.promotion_id, field: gate_evidence_ids}}
          authorized_by: {related: {via: input.promotion_id, field: accepted_by}}
        emits:
          - uxsearch.ratchet.ReferenceProposed
        payload:
          uxsearch.ratchet.ReferenceProposed:
            reference_proposal_id: {generated: true}
            promotion_id: input.promotion_id
        summary: Ratchet checks the change and decides under its ratchet policy; the engine stores no reference.

  - name: uxsearch.ratchet.RecordReferenceDecision
    naming:
      wire: record-reference-decision
      display: Record a reference decision
    input:
      - name: reference_proposal_id
        type: uxsearch.ratchet.ReferenceProposalId
      - name: adopted
        type: Boolean
      - name: decided_by
        type: String
    outcomes:
      - name: adopted
        when: adopted == true
        moves: uxsearch.ratchet.ReferenceProposal.adopt
        instance: reference_proposal_id
        sets:
          decided_by: input.decided_by
        emits:
          - uxsearch.ratchet.ReferenceDecided
        payload:
          uxsearch.ratchet.ReferenceDecided:
            reference_proposal_id: input.reference_proposal_id
            adopted: true
        summary: Ratchet adopted the reference change.

      - name: declined
        moves: uxsearch.ratchet.ReferenceProposal.decline
        instance: reference_proposal_id
        sets:
          decided_by: input.decided_by
        emits:
          - uxsearch.ratchet.ReferenceDecided
        payload:
          uxsearch.ratchet.ReferenceDecided:
            reference_proposal_id: input.reference_proposal_id
            adopted: false
        summary: Ratchet declined the reference change; the old references stand.

      - name: wrong-state
        wrong_state: true
        error: uxsearch.ratchet.ReferenceProposalStateConflict
        summary: The proposal was already decided.

events:
  - name: uxsearch.ratchet.RequirementBound
    fields:
      - name: requirement_id
