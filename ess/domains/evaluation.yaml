domain: uxsearch.evaluation

summary: >-
  Environments a target is evaluated in, the contract of each adapter's renderer (the layout model
  for ess-ui, a headless browser for browser), and evaluations: every metric for one variant on
  one state space in one environment. An evaluation is a pure function
  of its input digests, so it is keyed by them and computed once.

naming:
  wire: evaluation
  display: Evaluation

types:
  - name: uxsearch.evaluation.EnvironmentId
    kind: newtype
    of: Uuid

  - name: uxsearch.evaluation.EnvironmentDigest
    kind: newtype
    of: String
    prefix: "sha256:"

  # The digest of every input digest of an evaluation: variant, state space (which holds the
  # fixture digest), environment, renderer (the layout model version with its font table for
  # `ess-ui`, the browser version for `browser`: the adapter and its version), metric catalogue
  # and UX declarations. Same key, same metric values.
  - name: uxsearch.evaluation.EvaluationKey
    kind: newtype
    of: String
    prefix: "sha256:"

  # The digest of an evaluation's result (its metric values in canonical form).
  - name: uxsearch.evaluation.ResultDigest
    kind: newtype
    of: String
    prefix: "sha256:"

  # The digest of the metric catalogue an evaluation computed (keys and versions).
  - name: uxsearch.evaluation.CatalogueDigest
    kind: newtype
    of: String
    prefix: "sha256:"

  - name: uxsearch.evaluation.LayoutModelVersion
    kind: newtype
    of: String

  - name: uxsearch.evaluation.ThemeMode
    kind: enum
    variants: [light, dark]

  - name: uxsearch.evaluation.InputMode
    kind: enum
    variants: [pointer, keyboard]

  # Why an evaluation is insufficient evidence (docs/state-space.md § 7): a journey hit its state
  # bound; a state of the state space is not evaluable (the layout model refused a node, a
  # fixture is missing); the enumeration was abandoned; the layout model refused a node a metric
  # reads; the terminal path refused a step or a clock move passed its cycle limit; an
  # accessibility rule said `cantTell`; a view or channel has no fixture.
  - name: uxsearch.evaluation.Insufficiency
    kind: enum
    variants: [bound_hit, state_not_evaluable, enumeration_abandoned, layout_refused, step_refused, cant_tell, fixture_missing]

  # The evaluation stage (docs/state-space.md § 6): `static` reads the document alone, no state
  # space; `journey_paths` the states on the journeys' own paths (the merge gate's evidence);
  # `full` the whole state space within bounds (the promote gate's evidence).
  - name: uxsearch.evaluation.Stage
    kind: enum
    variants: [static, journey_paths, full]

  # The geometry a layout model version produces. Version 0 is ESS's terminal renderer: cell
  # geometry per node path (`Region {path, row, area, text}`), no pixels, no tokens, no
  # accessibility tree. A later version is a pixel model in CSS px. The layout model's input and
  # output shapes are described in docs/state-space.md § 4; no record of this specification
  # holds them.
  - name: uxsearch.evaluation.GeometryUnit
    kind: enum
    variants: [cells, css_px]

entities:
  # An evaluation condition, not a design choice. A component or widget target is rendered in a
  # harness container of the environment's container width; a wider target in the viewport.
  - name: uxsearch.evaluation.Environment
    naming:
      summary: Viewport, theme mode, input mode, text scale and motion for one target's evaluations.
    identity:
      name: environment_id
      type: uxsearch.evaluation.EnvironmentId
    fields:
      - name: target_id
        type: uxsearch.design.TargetId
      - name: name
        type: String
      - name: viewport_width_px
        type: Integer
      - name: viewport_height_px
        type: Integer
      # The harness container width for a component or widget target; absent for wider scopes.
      - name: container_width_px
        type: Optional<Integer>
      - name: theme_mode
        type: uxsearch.evaluation.ThemeMode
      - name: input_mode
        type: uxsearch.evaluation.InputMode
      - name: text_scale_percent
        type: Integer
      - name: reduced_motion
        type: Boolean
      - name: environment_digest
        type: uxsearch.evaluation.EnvironmentDigest
    invariants:
      - viewport_width_px > 0
      - viewport_height_px > 0
      - text_scale_percent > 0
    relations:
      - name: target
        kind: references
        target: uxsearch.design.Target
        cardinality: one
        via: target_id
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Layout model versions ship with the engine. A new version is a new evidence series in ratchet.
  # D1 (2026-11-23): version 0 is ESS's terminal renderer (cell geometry, `geometry: cells`); a
  # pixel model (`css_px`) comes later. Every evidence record names the version it used.
  # Round 3 (docs/targets.md:83-84): the layout model is one adapter's renderer. A row is the
  # renderer of one adapter at one version: `layout-model/0` renders for `ess-ui`, a headless
  # browser version (`browser/1`, `css_px`) for `browser`. The evaluation key names the row, so it
  # holds the adapter and its version, and a value measured in a browser never answers for the
  # cell model (ReuseEvaluation's `key-collision`). The name `LayoutModel` is kept so that the
  # records that copy `layout_model_version` (rule verdicts, ratchet evidence, campaigns) stay as
  # they are.
  - name: uxsearch.evaluation.LayoutModel
    naming:
      summary: One version of one adapter's renderer, known by its contract; the deterministic layout model for ess-ui.
    identity:
      name: version
      type: uxsearch.evaluation.LayoutModelVersion
    provided: true
    fields:
      - name: summary
        type: String
      - name: adapter
        type: uxsearch.design.AdapterKind
      - name: geometry
        type: uxsearch.evaluation.GeometryUnit
      # The digest of the font-metrics table the version lays text out with; absent for the
      # cell model.
      - name: font_table_digest
        type: Optional<String>
    lifecycle:
      initial: Available
      states: [Available]
      terminal: [Available]

  # Everything the evaluation's sufficiency depends on is copied from its state space when it is
  # requested (a closed state space no longer changes), so every branch of RecordEvaluationResult
  # is decided by the stored row and the input alone (GAPS.md G3).
  - name: uxsearch.evaluation.Evaluation
    naming:
      summary: Every metric for one variant on one state space in one environment, keyed by its input digests.
    identity:
      name: evaluation_key
      type: uxsearch.evaluation.EvaluationKey
    fields:
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: journey_id
        type: uxsearch.journeys.JourneyId
      # Complete, Incomplete, Truncated or Abandoned: the state of the state space when the
      # evaluation was requested (an Enumerating one is refused). Only Complete can be sufficient.
      - name: state_space_state
        type: uxsearch.journeys.StateSpace.State
      - name: stage
        type: uxsearch.evaluation.Stage
      # The states evaluated and the bound hit, if any (docs/ratchet.md § 4, bounds).
      - name: states_count
        type: Integer
      - name: bound_hit
        type: Optional<uxsearch.journeys.BoundKind>
      - name: environment_id
        type: uxsearch.evaluation.EnvironmentId
      - name: layout_model_version
        type: uxsearch.evaluation.LayoutModelVersion
      - name: catalogue_digest
        type: uxsearch.evaluation.CatalogueDigest
      # The digest of the uxui-declarations/1 file the metrics read (required, always-visible,
      # completion signal and cue nodes); absent when the base document has none.
      - name: declarations_digest
        type: Optional<uxsearch.design.DocumentDigest>
      - name: values
        type: List<uxsearch.metrics.MetricValue>
      - name: result_digest
        type: Optional<uxsearch.evaluation.ResultDigest>
      - name: insufficient_because
        type: Optional<uxsearch.evaluation.Insufficiency>
    relations:
      - name: variant
        kind: references
        target: uxsearch.design.Variant
        cardinality: one
        via: variant_digest
      - name: state_space
        kind: references
        target: uxsearch.journeys.StateSpace
        cardinality: one
        via: state_space_key
      - {name: journey, kind: references, target: uxsearch.journeys.Journey, cardinality: one, via: journey_id}
      - name: environment
        kind: references
        target: uxsearch.evaluation.Environment
        cardinality: one
        via: environment_id
      - name: layout_model
        kind: references
        target: uxsearch.evaluation.LayoutModel
        cardinality: one
        via: layout_model_version
    lifecycle:
      initial: Requested
      states:
        - Requested
        - {name: Computed, summary: Every metric has a value over a complete state space whose every state is evaluable.}
        - {name: Insufficient, summary: "A bound was hit, a state was not evaluable or the enumeration was abandoned; never a pass."}
      terminal: [Computed, Insufficient]
      transitions:
        - name: compute
          from: [Requested]
          to: Computed
        - name: insufficient
          from: [Requested]
          to: Insufficient

actors:
  - name: uxsearch.evaluation.EnvironmentAuthor
    naming:
      display: Environment author
      summary: A person who declares the environments a target is evaluated in.
    may:
      - uxsearch.evaluation.DeclareEnvironment

  - name: uxsearch.evaluation.Evaluator
    naming:
      display: Evaluator
      summary: The engine's evaluation worker; it runs the layout model and the metric functions. Not a person.
    may:
      - uxsearch.evaluation.RequestEvaluation
      - uxsearch.evaluation.ReuseEvaluation
      - uxsearch.evaluation.RecordEvaluationResult

errors:
  - name: uxsearch.evaluation.TargetNotFound
    summary: No target has this id, so nothing was declared.
    fields:
      - name: target_id
        type: uxsearch.design.TargetId

  - name: uxsearch.evaluation.ContainerMismatch
    summary: A component or widget target needs a container width, and a wider target takes none.
    fields:
      - name: target_id
        type: uxsearch.design.TargetId

  - name: uxsearch.evaluation.VariantPruned
    summary: The variant has a hard Violated verdict, so it is not evaluated.
    fields:
      - name: variant_digest
        type: uxsearch.design.VariantDigest

  - name: uxsearch.evaluation.StateSpaceNotFound
    summary: No state space has this key.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.evaluation.StateSpaceOpen
    summary: The state space is still being enumerated, so nothing is evaluated over it yet.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.evaluation.StateSpaceOfAnotherVariant
    summary: The state space was enumerated on another variant, so it does not answer for this one.
    fields:
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey

  - name: uxsearch.evaluation.EnvironmentNotFound
    summary: No environment has this id.
    fields:
      - name: environment_id
        type: uxsearch.evaluation.EnvironmentId

  - name: uxsearch.evaluation.LayoutModelNotFound
    summary: The engine ships no layout model of this version.
    fields:
      - name: version
        type: uxsearch.evaluation.LayoutModelVersion

  - name: uxsearch.evaluation.RendererMismatch
    summary: The renderer renders for another adapter than the target's, so nothing is evaluated with it.
    fields:
      - name: version
        type: uxsearch.evaluation.LayoutModelVersion

  # The key names its inputs: the same key with other inputs is a collision, never a cache hit.
  - name: uxsearch.evaluation.EvaluationExists
    summary: An evaluation of this key was requested before; ReuseEvaluation answers from it.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

  - name: uxsearch.evaluation.KeyCollision
    summary: An evaluation of this key exists with other inputs; nothing is answered from it.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

  # The determinism invariant as a refusal: a second result for one key that differs from the
  # first is a defect of the layout model or a metric function, never a new value.
  - name: uxsearch.evaluation.NotDeterministic
    summary: A result for this key was recorded before and differs; the stored result stands.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

  - name: uxsearch.evaluation.EvaluationNotFound
    summary: No evaluation has this key.
    fields:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey

commands:
  - name: uxsearch.evaluation.DeclareEnvironment
    naming:
      wire: declare-environment
      display: Declare an environment
    input:
      - name: target_id
        type: uxsearch.design.TargetId
      - name: name
        type: String
      - name: viewport_width_px
        type: Integer
      - name: viewport_height_px
        type: Integer
      - name: container_width_px
        type: Optional<Integer>
      - name: theme_mode
        type: uxsearch.evaluation.ThemeMode
      - name: input_mode
        type: uxsearch.evaluation.InputMode
      - name: text_scale_percent
        type: Integer
      - name: reduced_motion
        type: Boolean
    outcomes:
      - name: no-target
        when_related:
          via: input.target_id
          exists: false
        error: uxsearch.evaluation.TargetNotFound
        payload:
          uxsearch.evaluation.TargetNotFound:
            target_id: input.target_id
        summary: Nothing was declared.

      - name: needs-container
        when: {not: defined(container_width_px)}
        when_related:
          via: input.target_id
          predicate: {scope: [component, widget]}
        error: uxsearch.evaluation.ContainerMismatch
        payload:
          uxsearch.evaluation.ContainerMismatch:
            target_id: input.target_id
        summary: A component or widget is rendered in a harness container; nothing was declared.

      - name: takes-no-container
        when: defined(container_width_px)
        when_related:
          via: input.target_id
          predicate: {scope: [section, page, composition, product]}
        error: uxsearch.evaluation.ContainerMismatch
        payload:
          uxsearch.evaluation.ContainerMismatch:
            target_id: input.target_id
        summary: A wider target is rendered in the viewport, not a container; nothing was declared.

      - name: declared
        creates: uxsearch.evaluation.Environment
        instance: environment_id
        sets:
          target_id: input.target_id
          name: input.name
          viewport_width_px: input.viewport_width_px
          viewport_height_px: input.viewport_height_px
          container_width_px: input.container_width_px
          theme_mode: input.theme_mode
          input_mode: input.input_mode
          text_scale_percent: input.text_scale_percent
          reduced_motion: input.reduced_motion
          environment_digest: {generated: true}
        emits:
          - uxsearch.evaluation.EnvironmentDeclared
        payload:
          uxsearch.evaluation.EnvironmentDeclared:
            environment_id: {generated: true}
            target_id: input.target_id
        summary: Campaigns on the target can evaluate in this environment.

  # An evaluation is computed once per key: an unknown key is requested, a known one is answered
  # from the cache, and only when the stored row has the inputs the request names.
  - name: uxsearch.evaluation.RequestEvaluation
    naming:
      wire: request-evaluation
      display: Request an evaluation
    input:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: environment_id
        type: uxsearch.evaluation.EnvironmentId
      - name: layout_model_version
        type: uxsearch.evaluation.LayoutModelVersion
      - name: catalogue_digest
        type: uxsearch.evaluation.CatalogueDigest
      - name: declarations_digest
        type: Optional<uxsearch.design.DocumentDigest>
    outcomes:
      # A stored key is never requested again: ReuseEvaluation answers from it or refuses a
      # collision.
      - name: already-requested
        existing_instance: true
        error: uxsearch.evaluation.EvaluationExists
        payload:
          uxsearch.evaluation.EvaluationExists:
            evaluation_key: input.evaluation_key
        summary: Nothing was requested; ReuseEvaluation answers for this key.

      - name: no-state-space
        when_related:
          via: input.state_space_key
          exists: false
        error: uxsearch.evaluation.StateSpaceNotFound
        payload:
          uxsearch.evaluation.StateSpaceNotFound:
            state_space_key: input.state_space_key
        summary: Nothing was requested.

      - name: no-environment
        when_related:
          via: input.environment_id
          exists: false
        error: uxsearch.evaluation.EnvironmentNotFound
        payload:
          uxsearch.evaluation.EnvironmentNotFound:
            environment_id: input.environment_id
        summary: Nothing was requested.

      - name: no-layout-model
        when_related:
          via: input.layout_model_version
          exists: false
        error: uxsearch.evaluation.LayoutModelNotFound
        payload:
          uxsearch.evaluation.LayoutModelNotFound:
            version: input.layout_model_version
        summary: Nothing was requested.

      - name: state-space-open
        when_related:
          via: input.state_space_key
          predicate: state == Enumerating
        error: uxsearch.evaluation.StateSpaceOpen
        payload:
          uxsearch.evaluation.StateSpaceOpen:
            state_space_key: input.state_space_key
        summary: Nothing was requested.

      # The key names the variant: a state space enumerated on another variant does not answer.
      - name: state-space-of-another-variant
        when_related:
          via: input.state_space_key
          predicate: variant_digest != input.variant_digest
        error: uxsearch.evaluation.StateSpaceOfAnotherVariant
        payload:
          uxsearch.evaluation.StateSpaceOfAnotherVariant:
            state_space_key: input.state_space_key
        summary: Nothing was requested.

      # A variant with a Recorded hard Violated verdict is never evaluated further.
      - name: variant-pruned
        when_related:
          entity: uxsearch.rules.RuleVerdict
          where:
            all:
              - variant_digest == input.variant_digest
              - strength == hard
              - verdict == violated
              - state == Recorded
          exists: true
        error: uxsearch.evaluation.VariantPruned
        payload:
          uxsearch.evaluation.VariantPruned:
            variant_digest: input.variant_digest
        summary: Nothing was requested.

      # The renderer renders for one adapter, and the variant's target names the adapter it is
      # evaluated through. The target is two relations from the input (environment -> target ->
      # adapter), which `when_related` does not reach (GAPS.md G8), so the evaluator answers it.
      - name: renderer-of-another-adapter
        external: the renderer's adapter is not the adapter of the environment's target
        error: uxsearch.evaluation.RendererMismatch
        payload:
          uxsearch.evaluation.RendererMismatch:
            version: input.layout_model_version
        summary: Nothing was requested; a browser target is never evaluated on the cell model, nor an ess-ui target in a browser.

      - name: requested
        creates: uxsearch.evaluation.Evaluation
        instance: evaluation_key
        sets:
          variant_digest: input.variant_digest
          state_space_key: input.state_space_key
          journey_id: {related: {via: input.state_space_key, field: journey_id}}
          state_space_state: {related: {via: input.state_space_key, field: state}}
          stage: {related: {via: input.state_space_key, field: stage}}
          states_count: {related: {via: input.state_space_key, field: states_count}}
          bound_hit: {related: {via: input.state_space_key, field: bound_hit}}
          environment_id: input.environment_id
          layout_model_version: input.layout_model_version
          catalogue_digest: input.catalogue_digest
          declarations_digest: input.declarations_digest
          values: []
        emits:
          - uxsearch.evaluation.EvaluationRequested
        payload:
          uxsearch.evaluation.EvaluationRequested:
            evaluation_key: input.evaluation_key
            variant_digest: input.variant_digest
        summary: The evaluation is queued.

  # The cache lookup, split from RequestEvaluation so that the collision check reads the stored
  # row alone (`when_subject`). As a row-set guard on the creating command it multiplied synthesis
  # time (GAPS.md G14). The evaluator asks here first and requests on `no-evaluation`.
  - name: uxsearch.evaluation.ReuseEvaluation
    naming:
      wire: reuse-evaluation
      display: Reuse an evaluation
    input:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey
      - name: variant_digest
        type: uxsearch.design.VariantDigest
      - name: state_space_key
        type: uxsearch.journeys.StateSpaceKey
      - name: environment_id
        type: uxsearch.evaluation.EnvironmentId
      - name: layout_model_version
        type: uxsearch.evaluation.LayoutModelVersion
      - name: catalogue_digest
        type: uxsearch.evaluation.CatalogueDigest
    outcomes:
      - name: no-evaluation
        unknown_instance: true
        error: uxsearch.evaluation.EvaluationNotFound
        payload:
          uxsearch.evaluation.EvaluationNotFound:
            evaluation_key: input.evaluation_key
        summary: Nothing is cached under this key; the evaluator requests it.

      # A stored evaluation of this key with other inputs: the key collided, and the cache never
      # answers for inputs it was not computed from.
      - name: key-collision
        when_subject:
          predicate:
            any:
              - variant_digest != input.variant_digest
              - state_space_key != input.state_space_key
              - environment_id != input.environment_id
              - layout_model_version != input.layout_model_version
              - catalogue_digest != input.catalogue_digest
        error: uxsearch.evaluation.KeyCollision
        payload:
          uxsearch.evaluation.KeyCollision:
            evaluation_key: input.evaluation_key
        summary: Nothing was answered.

      - name: cached
        preserves: uxsearch.evaluation.Evaluation
        instance: evaluation_key
        summary: The key was evaluated before with the same inputs; its values are reused and nothing is computed.

  # The evaluation's own row holds what its state space was when it was requested, so every
  # branch here is decided by the stored row and the input alone. Only a Complete state space
  # (every state within the bounds enumerated, every state evaluable) can give a Computed result.
  - name: uxsearch.evaluation.RecordEvaluationResult
    naming:
      wire: record-evaluation-result
      display: Record an evaluation result
    input:
      - name: evaluation_key
        type: uxsearch.evaluation.EvaluationKey
      - name: result_digest
        type: uxsearch.evaluation.ResultDigest
      - name: values
        type: List<uxsearch.metrics.MetricValue>
      # Present when the evaluator could not decide a metric over some state: the first cause
      # it met. What the state space says (a bound hit, an unevaluable state, an abandoned
      # enumeration) is not sent here; it is read from the evaluation's own row.
      - name: refused
        type: Optional<uxsearch.evaluation.Insufficiency>
    outcomes:
      - name: no-evaluation
        unknown_instance: true
        error: uxsearch.evaluation.EvaluationNotFound
        payload:
          uxsearch.evaluation.EvaluationNotFound:
            evaluation_key: input.evaluation_key
        summary: Nothing was recorded.

      - name: not-deterministic
        when_subject:
          predicate:
            all:
              - {state: [Computed, Insufficient]}
              - defined(result_digest)
              - result_digest != input.result_digest
        error: uxsearch.evaluation.NotDeterministic
        payload:
          uxsearch.evaluation.NotDeterministic:
            evaluation_key: input.evaluation_key
        summary: The stored result stands; the evaluator is defective.

      - name: already-recorded
        when_subject:
          predicate: {state: [Computed, Insufficient]}
        preserves: uxsearch.evaluation.Evaluation
        instance: evaluation_key
        summary: The same result was recorded before; nothing changed.

      # A bound hit is insufficient evidence, whatever the values say.
      - name: bound-hit
        when_subject:
          predicate: state_space_state == Truncated
        moves: uxsearch.evaluation.Evaluation.insufficient
        instance: evaluation_key
        sets:
          values: input.values
          result_digest: input.result_digest
          insufficient_because: bound_hit
        emits:
          - uxsearch.evaluation.EvaluationInsufficient
        payload:
          uxsearch.evaluation.EvaluationInsufficient:
            evaluation_key: input.evaluation_key
            because: bound_hit
        summary: The state space was truncated; the evaluation is insufficient evidence.

      # A state that is not evaluable is insufficient evidence, whatever the evaluator sends.
      - name: state-not-evaluable
        when_subject:
          predicate: state_space_state == Incomplete
        moves: uxsearch.evaluation.Evaluation.insufficient
        instance: evaluation_key
        sets:
          values: input.values
          result_digest: input.result_digest
          insufficient_because: state_not_evaluable
        emits:
          - uxsearch.evaluation.EvaluationInsufficient
        payload:
          uxsearch.evaluation.EvaluationInsufficient:
            evaluation_key: input.evaluation_key
            because: state_not_evaluable
        summary: A state of the state space is not evaluable; the evaluation is insufficient evidence.

      - name: abandoned
        when_subject:
          predicate: state_space_state == Abandoned
        moves: uxsearch.evaluation.Evaluation.insufficient
        instance: evaluation_key
        sets:
          values: input.values
          result_digest: input.result_digest
          insufficient_because: enumeration_abandoned
        emits:
          - uxsearch.evaluation.EvaluationInsufficient
        payload:
          uxsearch.evaluation.EvaluationInsufficient:
            evaluation_key: input.evaluation_key
            because: enumeration_abandoned
        summary: The enumeration was abandoned; the evaluation is insufficient evidence.

      - name: refused
        when: defined(refused)
        moves: uxsearch.evaluation.Evaluation.insufficient
        instance: evaluation_key
        sets:
          values: input.values
          result_digest: input.result_digest
          insufficient_because: input.refused
        emits:
          - uxsearch.evaluation.EvaluationInsufficient
        payload:
          uxsearch.evaluation.EvaluationInsufficient:
            evaluation_key: input.evaluation_key
            because: input.refused
        summary: A metric could not be decided over some state; the evaluation is insufficient evidence.

      - name: computed
        moves: uxsearch.evaluation.Evaluation.compute
        instance: evaluation_key
        sets:
          values: input.values
          result_digest: input.result_digest
        emits:
          - uxsearch.evaluation.EvaluationComputed
        payload:
          uxsearch.evaluation.EvaluationComputed:
            evaluation_key: input.evaluation_key
            result_digest: input.result_digest
        summary: Every metric has a value over the complete, wholly evaluable state space.

