format: ess-ui-test/1
document: ../studio.ui.yaml
tests:
  - name: stopping a running campaign asks first and sends the command
    steps:
      - open: campaigns.list
      - expect: {at: pages/campaigns.list/sections/list, rows: [cp-01, cp-00]}
      - act: pages/campaigns.list/sections/list/rows/cp-01/row_actions/stop
      - act: pages/campaigns.list/sections/list/rows/cp-01/row_actions/stop/confirm/overlay
      - expect_command: {command: uxsearch.search.StopCampaign, input: {campaign_id: cp-01}}

  - name: a progress event lands in the live climb
    steps:
      - open: {page: campaigns.climb, params: {campaign_id: cp-01}}
      - expect: {at: pages/campaigns.climb/sections/points, rows: 3}
      - play: {event: uxsearch.search.CampaignProgressed, with: {climb_point_id: pt-04}}
      - advance: 1s
      - expect: {at: pages/campaigns.climb/sections/points/rows/pt-04, text: "70"}

  - name: switching one axis of a variant sends the switch
    fixtures:
      views:
        uxsearch.design.AxisSwitches:
          rows:
            - {axis_switch_id: sw-01, from_variant: "sha256:v-a1", axis_id: ax-layout, axis_value_id: av-04, reached: "sha256:v-b2", failure: null, state: Resolved}
            - {axis_switch_id: sw-02, from_variant: "sha256:v-b2", axis_id: ax-theme, axis_value_id: av-02, reached: "sha256:v-c3", failure: null, state: Resolved}
    steps:
      - open: {page: variants.detail, params: {variant_digest: "sha256:v-a1"}}
      - expect: {at: pages/variants.detail/sections/switches, rows: [sw-01]}
      - act: pages/variants.detail/sections/axes/rows/av-04/row_actions/switch
      - expect_command: {command: uxsearch.design.RequestAxisSwitch, input: {from_variant: "sha256:v-a1", axis_id: ax-layout, axis_value_id: av-04}}

  - name: the owner sees what gets worse and is offered only the accept that applies
    steps:
      - open: {page: promotions.detail, params: {promotion_id: pr-02}}
      - expect: {at: pages/promotions.detail/sections/decision/rows/pr-02, text: attention.glance_cost}
      - expect: {at: pages/promotions.detail/sections/decision/rows/pr-02/row_actions/trade_off, text: Accept trade-off}
      - open: {page: promotions.detail, params: {promotion_id: pr-01}}
      - expect: {at: pages/promotions.detail/sections/decision/rows/pr-01/row_actions/accept, text: Accept}
      - expect: {at: pages/promotions.detail/sections/decision/rows/pr-01, not_text: Accept trade-off}

  - name: starting a campaign from the catalog opens the form on that target
    steps:
      - open: {page: targets.catalog, state: {search: page}}
      - expect: {at: pages/targets.catalog/sections/list, rows: [tg-02]}
      - act: pages/targets.catalog/sections/list/rows/tg-02/row_actions/start
      - expect: {at: pages/campaigns.start/sections/target, text: Settings page}

  - name: the budget reads as its members and the KPI values as a list
    steps:
      - open: {page: campaigns.climb, params: {campaign_id: cp-01}}
      - expect: {at: pages/campaigns.climb/sections/summary, text: "400"}
      - expect: {at: pages/campaigns.climb/sections/summary, text: "3600"}
      - expect: {at: pages/campaigns.climb/sections/summary, not_text: "max_variants"}
      - expect: {at: pages/campaigns.climb/sections/frontier/rows/fe-01/columns/kpi_values, text: "kpi_id: kpi-effort, value: 6, kpi_id: kpi-glance, value: 2"}
      - open: {page: campaigns.frontier, params: {campaign_id: cp-01}}
      - expect: {at: pages/campaigns.frontier/sections/frontier/rows/fe-02/columns/kpi_values, text: "kpi_id: kpi-effort, value: 5, kpi_id: kpi-glance, value: 3"}

  - name: the step table shows its rows by seq, a live step included
    fixtures:
      views:
        uxsearch.search.Climb:
          rows:
            - {climb_point_id: pt-03, seq: 3, evaluated: 51, pruned: 14, insufficient: 2, frontier_size: 3, at: "2026-11-23T10:00:40Z"}
            - {climb_point_id: pt-01, seq: 1, evaluated: 12, pruned: 3, insufficient: 1, frontier_size: 2, at: "2026-11-23T10:00:00Z"}
            - {climb_point_id: pt-02, seq: 2, evaluated: 30, pruned: 9, insufficient: 2, frontier_size: 3, at: "2026-11-23T10:00:20Z"}
      scripts:
        climb:
          session: {campaign_id: cp-01}
          events:
            - {at: 1s, event: uxsearch.search.CampaignProgressed, payload: {climb_point_id: pt-04, campaign_id: cp-01, seq: 4, evaluated: 70, pruned: 19, frontier_size: 3}}
    steps:
      - open: {page: campaigns.climb, params: {campaign_id: cp-01}}
      - expect: {at: pages/campaigns.climb/sections/points, rows: [pt-01, pt-02, pt-03]}
      - play: {event: uxsearch.search.CampaignProgressed, with: {climb_point_id: pt-04}}
      - advance: 1s
      - expect: {at: pages/campaigns.climb/sections/points, rows: [pt-01, pt-02, pt-03, pt-04]}
