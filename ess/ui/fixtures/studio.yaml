# Invented sample data for ess/ui/studio.ui.yaml. Metric ids are the catalogue's (docs/metrics.md).
# The rows agree with the model: nothing on the frontier fails a hard rule (completion.miss is a
# hard rule, H = 0), the trade-off names a soft requirement only, and KPI values are keyed by KPI.
views:
  uxsearch.design.BaseDocuments:
    rows:
      - {base_document_id: doc-01, path: specs/console/ui.yaml, app: console, document_digest: "sha256:4f1c", supersedes: null, state: Registered}
  uxsearch.design.TargetCatalog:
    rows:
      - {target_id: tg-01, name: Whole console, scope: product, node_path: "/", host_slot: false}
      - {target_id: tg-02, name: Settings page, scope: page, node_path: pages/settings, host_slot: false}
      - {target_id: tg-03, name: Settings form, scope: section, node_path: pages/settings/sections/form, host_slot: false}
      - {target_id: tg-04, name: Status badge, scope: widget, node_path: widgets/status_badge, host_slot: false}
      - {target_id: tg-05, name: Flow editor, scope: component, node_path: pages/flows.editor/sections/editor, host_slot: true}
  uxsearch.design.Targets:
    rows:
      - {target_id: tg-01, base_document_id: doc-01, name: Whole console, scope: product, node_path: "/", host_slot: false, state: Declared}
