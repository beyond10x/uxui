  uxsearch.journeys.JourneysOfTarget:
    rows:
      - {journey_id: jr-01, name: Change the notification email}
  uxsearch.evaluation.EnvironmentsOfTarget:
    rows:
      - {environment_id: env-desk, name: Desktop light}
      - {environment_id: env-narrow, name: Narrow dark}
  uxsearch.metrics.KpisOfTarget:
    rows:
      - {kpi_id: kpi-effort, name: Effort to change settings, direction: lower_is_better, weight: 1}
  uxsearch.metrics.Kpis:
    rows:
      - {kpi_id: kpi-effort, target_id: tg-02, name: Effort to change settings, aggregation: weighted_sum, terms: [{metric_key: effort.actions, weight: 1}], direction: lower_is_better, weight: 1, state: Active}
